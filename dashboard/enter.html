<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>3dtrading</title>
<style>html,body{margin:0;height:100%;background:#fff}</style>
<!-- r50 (Nova) · hand-off from 「跳过，进入后台」 on the binding preview (8994).
     #who=<base64url JSON {e,n}> is the person who signed in on the log-in preview (8992); #lang= / #theme= carry the
     language and day/night they were using. This page starts the same local demo session here (no password, nothing
     sent), binds NO Binance account, and opens the dashboard, which therefore shows "not connected". -->
<script>window.TD_ROUTES={site:'/3dtrading-site/site/',auth:'/3dtrading-site/login/',login:'/3dtrading-site/login/?mode=login',signup:'/3dtrading-site/login/?mode=register',entry:'/3dtrading-site/login/',connect:'/3dtrading-site/bind/?from=app',bind:'/3dtrading-site/bind/?from=app'};</script>
<script src="account/td-account.js?v=r70" data-app="../app/index.html#/dashboard"></script>
<script src="account/td-auth.js?v=r58"></script>
</head>
<body>
<script>
(function () {
  'use strict';
  var h = new URLSearchParams(location.hash.slice(1)), who = null;
  try {
    var b = (h.get('who') || '').replace(/-/g, '+').replace(/_/g, '/');
    if (b) { while (b.length % 4) b += '='; who = JSON.parse(decodeURIComponent(escape(atob(b)))); }
  } catch (e) { who = null; }
  var A = window.TDAccount;
  var lang = h.get('lang'); if (lang === 'zh' || lang === 'en') { try { A.setLang(lang); } catch (e) { try { localStorage.setItem('3dt.lang', lang); } catch (x) {} } }
  /* r55: #theme= is ignored; the dashboard has one fixed look */
  var email = who && typeof who.e === 'string' && /^[^\s@]+@[^\s@]+$/.test(who.e) ? who.e.trim().toLowerCase() : '';
  var name = who && typeof who.n === 'string' ? who.n.slice(0, 40) : '';
  var cur = A.session();
  /* r58: an account with Google Authenticator 2FA on gets in only with the one-time ticket the log-in page issues after
     the code was checked (same tab, 2 minutes). A bare #who= link cannot skip the second step. */
  var AU = window.TDAuth;
  /* r67: log in lets anyone in, so the 2FA ticket gate is gone */
  if (email) {
    if (!cur || cur.email !== email) {
      /* a different person was signed in on this browser: end that local session first, then sign in or create this one */
      if (cur) { try { A.logout({ redirect: false }); } catch (e) {} }
      var r = A.login({ email: email, name: name }); if (!r.ok) A.register({ email: email, name: name });
    } else if (name && cur.name !== name) { A.login({ email: email, name: name }); }
  } else if (!cur) {
    /* opened without a log-in behind it (e.g. the binding preview on its own): a local demo user */
    var d = { email: 'demo@3dtrading.local', name: lang === 'en' ? 'Demo user' : '演示用户' };
    var r2 = A.login(d); if (!r2.ok) A.register(d);
  }
  /* r57: right after sign-up (#new=1) → ?welcome=1, the one-time bind prompt (once per account, see welcome()) */
  /* r66: land on a given page after sign-in — #to=ai here, or sessionStorage 3dt.next='ai' set before going to log in
     (e.g. the website's 「和 Dodo 对话」); used once, only known page names */
  var PG = ['dashboard', 'trades', 'wallet', 'ai', 'me', 'settings'], to = h.get('to') || '';
  try { if (!to) to = sessionStorage.getItem('3dt.next') || ''; sessionStorage.removeItem('3dt.next'); } catch (e) {}
  if (PG.indexOf(to) < 0) to = 'dashboard';
  location.replace('app/index.html' + (h.get('new') === '1' ? '?welcome=1' : '') + '#/' + to);
})();
</script>
<noscript>Please enable JavaScript. <a href="app/index.html#/dashboard">Dashboard</a></noscript>
</body>
</html>
