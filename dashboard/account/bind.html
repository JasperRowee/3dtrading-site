.welcome{display:none;margin:0 0 14px}

.list{margin:0 0 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.list:empty{display:none}

.acc{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:12px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.acc:hover{box-shadow:inset 0 0 0 1px var(--line2)}

 .card .inp input{height:46px;background:var(--sf)}

#go{height:48px;font-size:15px;box-shadow:none;border-radius:8px}
.safe{margin:14px 0 0;font-size:12px;padding:0;background:none!important;border:0;box-shadow:none;color:var(--ink3);line-height:1.6}.safe svg{display:none}

/* result */
.bootErr{padding:20px 0;font-size:14px;line-height:1.6;color:var(--ink2)}
.rhd{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}

.rhd h3{margin:2px 0 4px;font-size:18px}
.rhd p{margin:0;color:var(--ink2);font-size:13px;line-height:1.55}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.28);font-size:13px;margin-bottom:12px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;text-align:right;word-break:break-all}
.bl{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.bl li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.28);font-size:13px}

.bl li small{color:var(--ink3);font-family:var(--mono);font-size:12px}

.flow{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:7px;font-size:13px}
.flow li{display:flex;gap:10px;align-items:flex-start;line-height:1.5;color:var(--ink2)}

.sim{margin:14px 0 0;padding:0;border-top:1px solid var(--line2)}

.card.boot .brows,.card.boot #formView,.card.boot #demoBox,.card.boot #addBtn{display:none!important}
.ob{margin:0 0 14px}.ob a{color:inherit;font-weight:650}
.brows{display:grid;gap:10px;margin:0 0 14px}

.brow{border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);background:rgba(0,0,0,.18)}

.dot.demo{background:#6b7a8c}.dot.wait{background:var(--warn)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink3)}

.ticks.done li i{animation:tick .3s var(--ease) both;animation-delay:calc(var(--i) * 180ms)}

.fails{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}

    if (qs.get('add') === '1') S.adding = true;
    var reId = qs.get('id');
    if (qs.has('first') || qs.has('add') || qs.has('id')) { ['first', 'add', 'id'].forEach(function (k) { qs.delete(k); }); history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : '') + location.hash); }
    resetForm();
    API.demoControls.setNextOutcome('pass');
    renderAll();
    API.me().then(function (m) { $('#obNote').hidden = !(m && m.onboarding && !m.onboarding.agreed); });
    // ?id= reruns step ④ only: same public key, paste the API Key again
    var start = reId && !A.isDemo(reId) ? API.retest(reId).then(function () { S.open = reId; }, function () {}) : Promise.resolve(reId && (S.open = reId));
    start.then(refresh).then(function () {
      if (!S.open) { var need = S.list.filter(function (a) { return !isDemo(a) && ['awaiting_key', 'failed', 'checking'].indexOf(a.status) >= 0; })[0]; if (need) { S.open = need.id; render(); } }
      $('#panel').classList.remove('boot');
      if (reId) { var n = document.querySelector('.brow.open input[data-key]'); if (n) n.focus(); }
      stop(); draw(false); schedule();
    });
  } catch (err) {
    try { console.error(err); } catch (_) {}
    var bp = $('#panel'); bp.classList.add('boot');
    $('#unNote').innerHTML = '<p class="bootErr">' + esc(A.t('bind.bootErr')) + '</p>';
  }
})();
</script>
</body>
</html>
