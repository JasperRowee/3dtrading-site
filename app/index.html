<style>
:root{--bg:#fff;--top:64px;--sh:0 1px 2px rgba(15,23,42,.05),0 4px 22px rgba(15,23,42,.075);--sh2:0 2px 6px rgba(15,23,42,.06),0 18px 44px -14px rgba(15,23,42,.2);--sf:#fff;--ink:#0b0d10;--ink2:#454e5b;--ink3:#7d8694;--line:#e5e7eb;--line2:#eef0f3;--soft:#f7f8fa;
  --brand:#2fdcbc;--brandD:#0a8a73;--brandL:#e7f8f3;--cyan:#56cfe1;--blk:#0b0d10;--blk2:#171a1f;

h1,h2,h3{margin:0;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--brandD);outline-offset:2px}
[hidden]{display:none!important}
.sp{flex:1}
.up{color:var(--long)}.dn{color:var(--short)}.mut{color:var(--ink3)}
.L{color:var(--long)}.S{color:var(--short)}.G{color:var(--goldInk)}
.demo{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--goldInk);background:#fff6dc;border:1px solid #f3d98a;border-radius:6px;padding:0 6px;line-height:18px;vertical-align:1px;white-space:nowrap}

  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,background .2s,opacity .2s,border-color .2s}
.btn:hover{background:#262a31}.btn:active{transform:scale(.98)}

.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{border-color:#c9ced6;background:#fff}
.btn.danger{background:#fff;color:#c62f3a;border:1px solid #f1c4c8}.btn.danger:hover{background:#fff5f5;border-color:#e59aa1}

/* ---------- shell: top bar, account pill, avatar menu ---------- */

.acct-btn .t{flex:1;min-width:0;line-height:1.2}.acct-btn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.av-btn{appearance:none;border:0;padding:3px;border-radius:14px;background:none;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .2s}
.av-btn:hover,.me-m.open .av-btn{background:#f3f5f7}

.av-btn .av::after{content:"";position:absolute;right:-7px;bottom:-7px;width:16px;height:16px;border-radius:5px;background:var(--brand);transform:rotate(24deg);transition:transform .35s var(--ease)}

.menu{position:absolute;right:0;top:calc(100% + 10px);width:300px;background:#fff;border:0;border-radius:16px;box-shadow:0 0 0 1px rgba(15,23,42,.04),0 24px 60px -16px rgba(15,23,42,.32);padding:6px;display:none;z-index:40;transform-origin:top right}

.menu .ic svg{width:16px;height:16px}
.av-menu{width:320px;padding:8px}
.av-hd{display:flex;align-items:center;gap:12px;background:var(--blk);color:#fff;border-radius:12px;padding:14px;margin-bottom:6px;position:relative;overflow:hidden}

/* ---------- Dodo：直接对话；历史话题是右侧滑出的二级面板 ---------- */
.ai{position:relative;height:calc(100vh - var(--top))}
.chat{display:flex;flex-direction:column;min-height:0;height:100%;position:relative;background:#fff}

.chat-hd .who{display:flex;align-items:center;gap:9px;min-width:0;flex:0 1 auto}
.chat-hd .dd{flex:none;width:34px;height:28px;display:block}
.dd-av{display:block;width:100%;height:100%;overflow:visible}

.chat-hd .cvcur{font-size:14px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:300px}

.ai-st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--goldInk);background:#fff6dc;border-radius:999px;padding:3px 10px;white-space:nowrap;flex:none}

.hd-b:hover{background:#f3f5f7;color:var(--ink)}

.hd-b[aria-expanded="true"]{background:var(--blk);color:#fff}
.chat.fresh #cvNew2{display:none}
.stream{flex:1;overflow:auto;min-height:0;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16px);mask-image:linear-gradient(to bottom,transparent 0,#000 16px)}
.thread{max-width:760px;margin:0 auto;padding:22px 4px 36px;display:flex;flex-direction:column;gap:34px}
.qa{display:flex;flex-direction:column;gap:12px}
.qa .q-ctx{align-self:flex-end;display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;color:var(--brandD);background:var(--brandL);border-radius:999px;padding:3px 11px;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa .q-ctx span{opacity:.7;font-weight:500}
.qa .q{align-self:flex-end;max-width:min(78%,560px);width:fit-content;background:#f1f4f6;color:var(--ink);border-radius:18px 18px 6px 18px;padding:10px 16px;font-size:15.5px;line-height:1.6;overflow-wrap:anywhere}
.qa .a{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;font-size:15.5px;line-height:1.78;color:#1c2129}
.qa .a .av{width:34px;height:28px;margin-top:1px}
.qa .a .st{min-width:0;overflow-wrap:anywhere}
.qa .a .nm{display:block;font-size:13px;font-weight:700;color:var(--ink);line-height:1.2;margin:5px 0 6px}
.qa .a b.up{color:var(--long)}.qa .a b.dn{color:var(--short)}
.qa .src{margin-left:48px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--ink3)}
.qa .src a{font-weight:600;cursor:pointer;color:var(--brandD)}
.pend-c{display:flex;flex-direction:column;gap:3px;margin:12px 0;padding:12px 14px;border-radius:14px;background:#fffaf0;box-shadow:inset 0 0 0 1px #f3d98a;font-size:14.5px;line-height:1.6}
.pend-c b{color:var(--goldInk);font-size:13px}
.pend-c .btn{align-self:flex-start;margin-top:8px}
.typing{display:inline-flex;gap:4px;padding-top:4px}.typing i{width:6px;height:6px;border-radius:50%;background:#b7bec8;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,80%,100%{opacity:.3;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.composer{flex:none;padding:0 4px 18px;position:relative}
.chat:not(.fresh) .composer::before{content:"";position:absolute;left:0;right:0;top:-26px;height:26px;background:linear-gradient(rgba(255,255,255,0),#fff);pointer-events:none}
.box{max-width:760px;width:100%;box-sizing:border-box;margin:0 auto;background:#fff;border:1px solid #e1e5ea;border-radius:22px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 14px 34px -22px rgba(15,23,42,.3);padding:12px 12px 10px 18px;transition:border-color .2s,box-shadow .2s}
.box:focus-within{border-color:#8fe3d3;box-shadow:0 0 0 4px rgba(47,220,188,.16),0 14px 34px -22px rgba(15,23,42,.3)}
.box textarea{width:100%;border:0;outline:0;resize:none;background:none;font-size:16px;line-height:1.55;min-height:26px;max-height:180px;padding:2px 0;font-family:inherit}

.disc{max-width:760px;margin:10px auto 0;text-align:center;font-size:12.5px;color:var(--ink3);line-height:1.55;text-wrap:balance}
/* 进来时：Dodo、今天的一句摘要和提问框在中间，推荐问题是一排轻量的选项 */
.chat.fresh .stream{display:none}
.chat.fresh .composer{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:12vh}
.hello{display:none;max-width:760px;width:100%;margin:0 auto 22px;grid-template-columns:76px minmax(0,1fr);gap:2px 18px;align-items:center;isolation:isolate}
.chat.fresh .hello{display:grid}
.hi-bot{grid-row:1/3;width:76px;height:76px;position:relative}
.hi-bot::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(closest-side,rgba(47,220,188,.2),rgba(47,220,188,0));z-index:-1}
.hi-bot svg{width:100%;height:100%;display:block;animation:ddf 4.2s ease-in-out infinite}
@keyframes ddf{50%{transform:translateY(-3px)}}
.hello h2{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.25;align-self:end}
.hello .sum{margin:6px 0 0;color:var(--ink2);font-size:15.5px;line-height:1.6;align-self:start}
.hello .sum b{font-weight:650;color:var(--ink)}.hello .sum b.up{color:var(--long)}.hello .sum b.dn{color:var(--short)}

/* trade detail inside the drawer */
.td-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.td-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;background:var(--blk);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:16px}
.td-hero .note{font-size:13px;color:#9aa3b0}
.td-hero h3{font-size:25.5px;display:flex;align-items:center;gap:10px;margin-top:4px}
.td-hero .act{font-size:13px;font-weight:700;padding:2px 8px;border-radius:6px;background:#22272f}
.td-hero .act.L{color:#4ade80}.td-hero .act.S{color:#ff7a7e}.td-hero .act.G{color:var(--brand)}
.td-big{font-size:27.5px;font-weight:700;text-align:right}.td-big small{display:block;font-size:12.5px;color:#9aa3b0;font-weight:500}
.td-big.up{color:#4ade80}.td-big.dn{color:#ff7a7e}
.td-g{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}
.td-f{display:grid;grid-template-columns:88px 1fr;gap:0;margin:0;font-size:14px}
.td-f dt,.td-f dd{padding:6px 0;border-top:1px solid var(--line2);margin:0}.td-f dt{color:var(--ink3)}
.td-h{font-size:13px;font-weight:700;color:var(--ink3);margin:0 0 6px}
.chain{list-style:none;margin:0;padding:0;counter-reset:c}
.chain li{display:flex;justify-content:space-between;align-items:center;padding:7px 0 7px 26px;border-top:1px solid var(--line2);position:relative;counter-increment:c;font-size:14px}
.chain li::before{content:counter(c);position:absolute;left:0;width:18px;height:18px;border-radius:50%;background:var(--soft);font-size:12px;display:grid;place-items:center;color:var(--ink3)}
.chain li.now::before{background:var(--blk);color:#fff}
.chain button{appearance:none;border:0;background:none;padding:0;font-weight:600;cursor:pointer}
.chain small{color:var(--ink3);font-size:13px}
.td-ctx{grid-column:1/-1}
.td-say{font-size:14px;color:var(--ink2);background:var(--soft);border-radius:10px;padding:10px 12px;margin:0 0 10px}

/* ---------- 钱包: platform wallet ---------- */
.wg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;padding-top:26px}
.bal{background:var(--blk);color:#fff;border-radius:22px;padding:26px 26px 22px;position:relative;display:flex;flex-direction:column;min-height:250px}
.bal .clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.bal .clip::before{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:44px;background:var(--brand);opacity:.1;transform:rotate(24deg);transition:transform 1s var(--ease)}
.bal .clip::after{content:"";position:absolute;left:38%;top:-50px;width:110px;height:110px;border-radius:28px;border:2px solid rgba(47,220,188,.18);transform:rotate(-12deg);transition:transform 1s var(--ease)}
.bal:hover .clip::before{transform:rotate(44deg) translate(-14px,-10px)}.bal:hover .clip::after{transform:rotate(10deg) translate(8px,6px)}
.bal>*:not(.clip){position:relative}
.bal .mascot{position:absolute;right:26px;top:-40px;width:78px;height:78px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25))}
.bal:hover .mascot .arm-r{animation:wave 1s ease-in-out 1}
html.rm .bal:hover .mascot .arm-r{animation:none}
.bal .k{font-size:13.5px;color:#9aa3b0;font-weight:600}
.bal .v{font-size:44.5px;font-weight:750;letter-spacing:-.03em;margin-top:10px;line-height:1.15}
.bal .v small{font-size:15px;color:#9aa3b0;margin-left:8px;font-weight:600;letter-spacing:0}
.bal .d{font-size:13.5px;color:#aeb6c1;margin-top:6px}
.bal .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);font-size:12.5px;color:#9aa3b0}
.bal .kv b{display:block;font-size:15px;color:#fff;font-weight:650;margin-top:2px}.bal .kv b.tbd{color:#fcd535;font-size:14px}
.bal .acts{display:flex;gap:10px;margin-top:auto;padding-top:18px;z-index:1}
.bal .btn.ghost{background:transparent;color:#fff;border-color:#3a414b}
.subc{background:linear-gradient(150deg,#e8fbf6,#dcf5f5);border:0;border-radius:22px;padding:22px 24px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.subc .top{display:flex;align-items:center;gap:10px}
.fx{display:flex;align-items:stretch;gap:10px;margin-top:16px}
.fx>div{background:rgba(255,255,255,.72);border-radius:14px;padding:12px 14px;flex:1;min-width:0}
.fx>div.res{background:var(--blk);color:#fff;flex:1.25}
.fx>i{align-self:center;font-style:normal;font-size:21px;color:#3f6b62;font-weight:600}
.fx span{display:block;font-size:12.5px;color:#3f6b62}.fx .res span{color:#9aa3b0}
.fx b{display:block;font-size:21px;font-weight:720;letter-spacing:-.02em;margin-top:3px;white-space:nowrap}
.fx small{display:block;font-size:12px;color:#3f6b62;margin-top:2px}.fx .res small{color:#fcd535}
.subc .exp{font-size:13.5px;color:#2f5c54;line-height:1.65;margin:14px 0 0}
.subc .exp b{color:var(--ink)}
.wg2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;margin-top:18px}
.wpan{padding:18px 0 6px}
.wpan .hd2{padding:0 20px}
.rules{padding:18px 20px}
.rules h3{margin:14px 0 8px;font-size:13px;color:var(--ink3);font-weight:650;display:flex;align-items:center;gap:6px}
.rules h3:first-of-type{margin-top:6px}
.rules ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rules li{display:flex;gap:10px;align-items:baseline;font-size:14px;padding:8px 12px;border-radius:10px;background:#f7f9fa}
.rules li b{font-weight:650;min-width:84px}.rules li span{color:var(--ink2)}
.rules li.tbd{background:#fffaeb}.rules li.tbd span{color:var(--goldInk)}
.tag{font-size:12px;font-weight:650;border-radius:6px;padding:1px 7px}
.tag.ok{background:#e7f8ee;color:#137a3a}.tag.tbd{background:#fff6dc;color:var(--goldInk)}
.wt td.mut2{color:var(--ink3)}
.bills{margin-top:18px;padding:16px 0 4px}
.bills .hd2{padding:0 20px}
.wt{width:100%;border-collapse:collapse;font-size:14px}
.wt th{text-align:left;font-size:12.5px;color:var(--ink3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line2);background:#f8fafb}
.wt td{padding:10px;border-bottom:1px solid var(--line2)}
.wt th:first-child,.wt td:first-child{padding-left:20px}.wt th:last-child,.wt td:last-child{padding-right:20px}
.wt .r{text-align:right}
.wt tr.new td{animation:hl 2.4s ease-out}
@keyframes hl{from{background:#e7f8f3}}
.bs{font-size:12.5px;font-weight:600;border-radius:6px;padding:1px 7px;white-space:nowrap}
.bs.ok{background:#e7f8ee;color:#137a3a}.bs.dm{background:#fff6dc;color:var(--goldInk)}
.wnote{font-size:13px;color:var(--ink3);margin:14px 0 0}
/* dialog flows */
.steps2{display:flex;gap:6px;margin:4px 0 16px}
.steps2 span{flex:1;height:4px;border-radius:3px;background:var(--line2)}.steps2 span.on{background:var(--ink)}
.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{appearance:none;border:1px solid transparent;box-shadow:var(--sh);background:#fff;border-radius:12px;padding:12px;text-align:left;cursor:pointer;font-size:14px;transition:border-color .15s,box-shadow .15s}
.opt:hover{box-shadow:var(--sh2)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.opt b{display:block;font-size:18px}.opt small{color:var(--ink3);font-size:13px}
.fl{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px}
.inp{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:15px;outline:0}
.inp:focus{border-color:var(--ink)}
.summ{background:var(--soft);border-radius:12px;padding:6px 14px;margin:6px 0 12px}
.summ>div{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}.summ>div:first-child{border-top:0}
.warn{font-size:13.5px;color:var(--goldInk);background:#fff8e3;border:1px solid #f3d98a;border-radius:10px;padding:9px 12px;margin:10px 0 0}
.mdl-ft{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.done{text-align:center;padding:10px 0 4px}
.done .ic{width:52px;height:52px;border-radius:16px;background:var(--blk);display:inline-grid;place-items:center;margin-bottom:12px}
.done h3{font-size:19px}.done p{color:var(--ink2);font-size:14.5px;margin:8px 0 0}

/* ---------- 我的 ---------- */
.me{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.me-col{display:flex;flex-direction:column;gap:14px}
.prof{background:var(--blk);color:#fff;border-radius:var(--r);padding:20px 22px;display:grid;grid-template-columns:52px 1fr;gap:4px 14px;align-items:center}
.prof .av{position:relative;width:52px;height:52px;border-radius:15px;background:var(--brand);color:#032720;font-weight:800;font-size:19px;display:grid;place-items:center;grid-row:1/3}
.prof b{font-size:18px}.prof small{color:#9aa3b0;font-size:13.5px}
.prof .st3{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;padding-top:14px;border-top:1px solid #262b33}
.prof .st3 span{display:block;font-size:12.5px;color:#9aa3b0}.prof .st3 b{font-size:16px}
.ms{padding:18px 20px}
.ms h2{font-size:16px;margin-bottom:10px}
.acc-li{list-style:none;margin:0;padding:0}
.acc-li li{display:grid;grid-template-columns:30px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
.acc-li li.on .tx b::after{content:"当前查看";font-size:12px;font-weight:600;color:var(--brandD);background:var(--brandL);border-radius:5px;padding:0 6px;margin-left:8px}
.acc-li .bn{width:30px;height:30px;border-radius:9px;background:#1e2329;display:grid;place-items:center}
.acc-li .acts{display:flex;gap:8px;justify-content:flex-end}.acc-li .tx{padding:0;display:block}.acc-li .tx b{display:block;font-size:14.5px}.acc-li .tx small{font-size:13px;color:var(--ink3)}
.stt{font-size:12.5px;font-weight:600;border-radius:6px;padding:1px 7px;background:#e7f8ee;color:#137a3a;white-space:nowrap}
.stt.off{background:#f1f2f4;color:var(--ink3)}.stt.demo2{background:#fff6dc;color:var(--goldInk)}
.me-row{display:flex;align-items:center;gap:16px;padding:11px 0;border-top:1px solid var(--line2)}
.me-row>div:first-child{flex:1}.me-row b{display:block;font-size:14.5px}.me-row small{font-size:13px;color:var(--ink3)}
.me-note{font-size:13px;color:var(--ink3);margin:10px 0 0}
.lvt{overflow-x:auto;margin:10px 0 4px;-webkit-overflow-scrolling:touch}.lvt table{width:100%;font-size:12px;border-collapse:collapse}.lvt th,.lvt td{padding:5px 6px;text-align:left;white-space:nowrap;border-top:1px solid var(--line2)}.lvt th{font-weight:600;color:var(--ink3);border-top:0}.lvt .r{text-align:right}.lvt .td-h{margin:0 0 4px}
.brief .r.umr b{font-size:18px}
.brief button.r.umr{appearance:none;border:0;background:none;font:inherit;color:inherit;width:100%;text-align:left;cursor:pointer;border-top:1px solid rgba(255,255,255,.07);border-radius:0}
.brief button.r.umr:hover .umh-tg,.brief button.r.umr:focus-visible .umh-tg{color:#fff;border-color:rgba(255,255,255,.4)}
.brief button.r.umr{white-space:nowrap}.brief button.r.umr small{min-width:0;overflow:hidden;text-overflow:ellipsis}
.brief .umh-tg{flex:none;font-size:11.5px;font-weight:600;color:#9aa3b0;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:1px 8px;line-height:16px;align-self:center}
.brief .umh-tg::after{content:' ▾';font-size:9px}.brief.umh-on .umh-tg::after{content:' ▴'}
.brief.umh-on .r:not(.umr),.brief.umh-on .rm{display:none}
.umh{padding:2px 0 6px}
.umh-c{display:block;width:100%;height:auto;max-height:118px;overflow:visible}
.umh-c text{font-size:9px;fill:#7d8794;font-family:inherit}
.umh-c .th{stroke:#ffb44d;stroke-width:1;stroke-dasharray:3 3;opacity:.7}
.umh-c circle{fill:#c3c9d2}.umh-c circle.nw{fill:var(--brand);stroke:#0b0f14;stroke-width:1.5}
.umh-cap{margin:4px 0 0;font-size:11.5px;color:#7d8794;line-height:1.5}.umh-cap .demo{margin-right:6px}
.umh-empty{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#9aa3b0;line-height:1.5;padding:8px 10px;border:1px dashed rgba(255,255,255,.16);border-radius:10px}
.umh-empty>b{color:#fff;font-size:12.5px}.umh-empty b.num{color:#fff}
.dens{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.dens button{appearance:none;border:0;background:none;border-radius:8px;height:28px;padding:0 10px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.dens button svg{width:12px;height:12px}
.dens button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.12)}

/* ---------- misc ---------- */
.tip{position:fixed;z-index:80;pointer-events:none;opacity:0;background:var(--blk);color:#fff;border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.55;transition:opacity .12s;max-width:280px}
.tip b{font-size:15px}
.tip .tp-d{display:block;color:#9aa3b0;margin-bottom:3px}.tip .tp-r{display:flex;align-items:center;gap:6px}.tip .tp-r i{width:7px;height:7px;border-radius:2px}.tip .tp-r b{margin-left:auto;font-size:13px}
.tip .tp-r.w i{background:#9aa6b4}.tip .tp-u{display:block;color:#9aa3b0;margin-top:3px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--blk);color:#fff;border-radius:12px;padding:10px 16px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);z-index:90}
.toast.on{opacity:1;transform:translate(-50%,0)}
.flash{animation:flash 1.2s ease-out}@keyframes flash{0%{box-shadow:0 0 0 3px rgba(47,220,188,.6)}100%{box-shadow:0 0 0 3px rgba(47,220,188,0)}}
html.rm *{animation:none!important}
@media (max-width:1360px){header.top{padding:0 28px}#dash{padding-left:28px;padding-right:28px}.hero{grid-template-columns:minmax(0,1fr) 272px}.hero .v{font-size:42.5px}.hero .nsp{width:calc(100% - 300px)}.ov-mid{grid-template-columns:minmax(0,1fr) 360px}.posp{grid-template-columns:260px minmax(0,1fr)}}
@media (max-height:780px){#dash{padding-top:18px}.ph{margin-bottom:12px}.ph h1{font-size:22.5px}}

.wi.kc{box-shadow:inset 0 0 0 1px var(--line)}
/* mascot */
.bot .arm-r{transform-box:view-box;transform-origin:80px 47px}
.peek{pointer-events:auto;cursor:pointer;transition:height .38s cubic-bezier(.3,1.5,.5,1)}
.peek:hover,.peek.hi{height:66px}
.peek-in{animation:peekUp .9s .2s cubic-bezier(.2,.8,.2,1) both}
.peek.hi .arm-r{animation:wave 1s ease-in-out 1}
.peek.hi .eye{animation:blink2 .42s 1}
.peek.hop .peek-in{animation:hop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes wave{0%,100%{transform:rotate(0)}20%{transform:rotate(-38deg)}45%{transform:rotate(-14deg)}70%{transform:rotate(-34deg)}}
@keyframes blink2{0%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
@keyframes hop{40%{transform:translateY(-8px)}}
.bot .eye{transform-origin:47px 43px;animation:blink 4.6s 1.2s 2 both}
.peek:hover .eye{animation:blink2 .42s 1}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
/* ===================== BIND (dark, unchanged from original) ===================== */
#bind{display:none;min-height:100vh;background:#0b0e11;color:#eaecef}
body.binding #bind{display:block}
body.binding #dash,body.binding header.top{display:none}
body.binding{background:#0b0e11}
.bd-top{height:60px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid #1e2329;max-width:1280px;margin:0 auto}
.bd-top .logo{color:#fff}
.bd-top .back{color:#b7bdc6;text-decoration:none;font-size:15px;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px}
.bd-top .back:hover{background:#1e2329;color:#fff}
.bd-main{max-width:1280px;margin:0 auto;padding:24px 20px 60px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
.bd-h{grid-column:1/-1}
.bd-h h1{margin:0;font-size:27.5px;letter-spacing:-.4px}
.bd-h p{margin:6px 0 0;color:#848e9c;font-size:15px}
/* tutorial */
.tut{background:#14171c;border:1px solid #23282f;border-radius:20px;padding:16px;position:sticky;top:16px}
.tut-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tut-hd .lb{font-size:13px;color:#848e9c;display:flex;align-items:center;gap:8px}
.tut-hd .lb b{color:#fcd535;font-weight:700;font-size:14px}
.steps{display:flex;gap:6px}
.steps button{border:0;cursor:pointer;width:30px;height:30px;border-radius:9px;background:#1e2329;color:#848e9c;font-size:14px;font-weight:700;position:relative;overflow:hidden}
.steps button.on{color:#181a20;background:#fcd535}
.steps button.done{color:#eaecef}
.bn-win{position:relative;border-radius:14px;overflow:hidden;border:1px solid #2b3139;background:#181a20;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.bn-bar{height:32px;background:#0b0e11;display:flex;align-items:center;gap:6px;padding:0 12px}
.bn-bar i{width:10px;height:10px;border-radius:50%;background:#2b3139}
.bn-bar .url{margin-left:10px;flex:1;max-width:340px;height:20px;border-radius:6px;background:#1e2329;color:#5e6673;font-size:12px;display:flex;align-items:center;padding:0 10px;overflow:hidden;white-space:nowrap}
.bn-hd{height:44px;display:flex;align-items:center;gap:16px;padding:0 14px;background:#181a20;border-bottom:1px solid #2b3139;font-size:13px;color:#eaecef}
.bn-logo{display:flex;align-items:center;gap:6px;color:#fcd535;font-weight:800;letter-spacing:.8px;font-size:14px}
.bn-logo i{width:14px;height:14px;background:#fcd535;transform:rotate(45deg);border-radius:2px;display:inline-block}
.bn-hd .nv{display:flex;gap:14px;color:#b7bdc6}
.bn-hd .me{margin-left:auto;width:22px;height:22px;border-radius:50%;background:#2b3139}
.bn-body{display:grid;grid-template-columns:132px 1fr;height:360px}
.bn-side{background:#181a20;border-right:1px solid #2b3139;padding:10px 6px;display:flex;flex-direction:column;gap:2px}
.bn-side div{font-size:13px;color:#b7bdc6;padding:8px 10px;border-radius:6px;transition:.25s}
.bn-side div.on{background:#2b3139;color:#fcd535;font-weight:600}
.bn-main{padding:16px;position:relative;overflow:hidden;background:#0b0e11}
.bn-main h4{margin:0 0 12px;font-size:16px;color:#eaecef}
.bn-scr{animation:scr .35s}
@keyframes scr{from{opacity:0;transform:translateX(10px)}}
.bn-cardz{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bn-c{background:#181a20;border-radius:10px;padding:10px;font-size:12px;color:#848e9c}
.bn-c b{display:block;color:#eaecef;font-size:16px;margin-top:4px}
.bn-vip{display:inline-block;background:#3c2601;color:#fcd535;font-size:12px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px}
.bn-t{width:100%;font-size:12px;border-collapse:collapse}
.bn-t th{color:#848e9c;font-weight:500;text-align:left;padding:7px 6px;border-bottom:1px solid #2b3139;font-size:12px}
.bn-t td{color:#eaecef;text-align:left;padding:9px 6px;border-bottom:1px solid #1e2329}
.bn-t tr.hl td{background:#1e2329}
.bn-btn{display:inline-block;border:0;background:#fcd535;color:#181a20;font-weight:700;font-size:12px;border-radius:6px;padding:6px 10px;transition:.2s}
.bn-btn.g{background:#2b3139;color:#eaecef}
.bn-btn.pr{transform:scale(.94);filter:brightness(.9)}
.bn-modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;animation:scr .3s}
.bn-dlg{width:min(300px,92%);background:#1e2329;border-radius:12px;padding:16px;font-size:13px;color:#b7bdc6}
.bn-dlg h5{margin:0 0 12px;font-size:15px;color:#eaecef}

/* 窄桌面：先收起账户副标题，再收窄导航，保证不压到 Logo 和账户切换 */
@media (min-width:761px) and (max-width:1320px){#acctBtn .t small{display:none}}
@media (min-width:761px) and (max-width:1180px){#acctBtn .t{display:none}.bub{max-width:200px}}
@media (min-width:761px) and (max-width:940px){.bub{display:none}}
@media (max-width:760px){.lrail,.hang,.dchat{display:none!important}}
/* 仅留引导：默认四项收起，只见 Dodo 左侧「当前页 ⌄」引导；靠近 Dodo / 引导 / 两侧区域、键盘聚焦或点引导才展开，离开约 0.4 秒收起 */
.dh-ledge{position:absolute;left:-26px;right:-26px;top:60px;height:4px;border-radius:3px;background:#0b0d10;pointer-events:none;transition:opacity .3s}
body.dh-up .hang:not(.chat) .dh-ledge,body[data-page="ai"] .hang:not(.chat) .dh-ledge{opacity:0}

/* ===================== 方案二 · 顶部悬浮导航（8812） =====================
   取消左栏。电脑宽度：一条纯白、无边框、轻阴影的悬浮条，与正文同宽同边；
   3dtrading Logo 真正居中，左「总览 / 交易记录」、右「钱包 / Dodo」对称；
   账户切换在最左、头像在最右，作为辅助入口。手机宽度沿用底部标签栏。 */
.fnav{display:none}
@media (min-width:761px){
  :root{--top:80px;--gx:40px;--fh:60px}
  html{scroll-padding-top:calc(var(--top) + 24px)}
  #dash{margin-left:0!important}
  header.top{position:sticky;top:12px;margin:12px auto 0;width:calc(100% - var(--gx) * 2);max-width:1680px;height:var(--fh);
    padding:0 10px;gap:10px;border:0;border-radius:18px;background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none;
    box-shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px -14px rgba(15,23,42,.16);transition:box-shadow .25s}
  body.scrolled header.top{box-shadow:0 1px 2px rgba(15,23,42,.05),0 16px 38px -14px rgba(15,23,42,.24)}
  /* 滚动后顶部 12px 缝隙用白色渐隐遮住，正文不会从悬浮条上方露出来 */
  body::before{content:"";position:fixed;left:0;right:0;top:0;height:30px;z-index:29;pointer-events:none;background:linear-gradient(#fff 40%,rgba(255,255,255,0));opacity:0;transition:opacity .2s}
  body.scrolled::before{opacity:1}
  header.top>.brandmark,header.top>.tnav,header.top>.demo,header.top>.sp{display:none}
  /* 账户在左、头像在右；中间整条导航绝对居中，Logo 落在悬浮条的正中 */
  header.top{justify-content:space-between}
  #acct{order:0}#meM{order:2}
  .fnav{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content}
  .fn-g{display:flex;gap:4px}.fn-l{justify-content:flex-end}.fn-r{justify-content:flex-start}
  .fn-a{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;color:var(--ink2);font-weight:600;font-size:15px;white-space:nowrap;transition:background .2s,color .2s}
  .fn-a svg{width:17px;height:17px;flex:none}
  .fn-a:hover{background:#f3f5f7;color:var(--ink)}
  .fn-a[aria-current="page"]{background:var(--blk);color:#fff}
  .fn-a[aria-current="page"] svg{color:var(--brand)}
  .fn-a:focus-visible,.fn-logo:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .fn-logo{display:block;padding:6px 26px;border-radius:12px}
  .fn-logo img{display:block;height:26px;width:auto}
  .acct-btn{height:40px}
  /* 账户切换在左端：菜单向右展开，不出屏 */
  #acct .menu{left:0;right:auto;transform-origin:top left}
  .av-btn{padding:2px}
  /* 正文：去掉给 Dodo 头留的大空白，标题与悬浮条左缘对齐 */
  #dash{padding:28px var(--gx) 40px;min-height:calc(100vh - 72px)}
  body:not([data-page="ai"]) .ph{min-height:0!important;align-items:flex-end;padding-right:0}
  body:not([data-page="ai"]) .ph>div:first-child{max-width:none!important}
  .ph{margin-bottom:20px}
  /* AI：会话栏与聊天放进与悬浮条同宽的区域，新会话输入框仍居中 */
  body[data-page="ai"] #dash{padding:16px var(--gx) 0}
  body[data-page="ai"] .page{max-width:1680px}
  .ai{height:calc(100vh - 72px - 16px)}
}
/* 横屏/宽屏打开软键盘（如手机横屏 956×440）：收起悬浮条，把可见高度全部给对话与输入框 */
@media (min-width:761px){
  body.kb-open header.top{display:none}
  body.kb-open::before{display:none}
  body.kb-open[data-page="ai"] #dash{padding-top:8px}
  body.kb-open .ai{height:calc(var(--vvh,100vh) - 8px)}
  /* 键盘开着时只留会话标题（含「演示模式」标记）、消息和输入框；问候、推荐问题、免责说明暂时收起，收键盘后恢复 */
  body.kb-open .chat-hd{height:44px}
  body.kb-open .chat.fresh .hello,body.kb-open .chat.fresh .sugg,body.kb-open .disc{display:none!important}
  body.kb-open .cv-list{top:8px;bottom:8px}
  body.kb-open .chat.fresh .composer{justify-content:flex-end;padding-bottom:8px}
  body.kb-open .composer{padding-bottom:8px}
  body.kb-open .cv-foot{display:none}
  body.kb-open .cv-top{padding:10px 14px 6px}
}
/* 低高度宽屏（如手机横屏 956×440）：新会话的问候缩小，输入框留在可见区，推荐问题可在下方滚动 */
@media (min-width:761px) and (max-height:560px){
  body[data-page="ai"] #dash{padding-top:10px}
  .ai{height:calc(100vh - 72px - 10px)}
  .chat-hd{height:48px}
  .chat.fresh .composer{justify-content:flex-start;padding:14px 28px 12px;overflow:auto;min-height:0}
  .hello{margin-bottom:12px;grid-template-columns:1fr}.hi-bot,.hello .sum{display:none}.hello h2{font-size:20px}
  .sugg{margin-top:10px}
  .chat.fresh .disc{margin-top:10px}
  .cv-top{padding:12px 14px 8px}
  .cv-scroll{min-height:0}
}
/* 手机横屏（宽 >760、高 ≤560）对话中 / 横屏键盘打开：输入框收成一行、发送键放在行尾，免责说明压成一行，把高度留给消息 */
@media (min-width:761px) and (max-height:560px){
  .chat:not(.fresh) .chat-hd{height:44px}
  .chat:not(.fresh) .composer{padding-bottom:6px}
  .chat:not(.fresh) .composer::before{top:-16px;height:16px}
  .chat:not(.fresh) .box,body.kb-open .box{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0 8px;padding:5px 5px 5px 16px;border-radius:20px}
  .chat:not(.fresh) .box .ctxc,body.kb-open .box .ctxc{flex:1 0 100%;margin:3px 0 4px -6px}
  .chat:not(.fresh) .box textarea,body.kb-open .box textarea{flex:1 1 0;min-width:0;width:auto;max-height:88px;padding:6px 0}
  .chat:not(.fresh) .box .bar,body.kb-open .box .bar{margin-top:0}
  .chat:not(.fresh) .box .bar small,body.kb-open .box .bar small,.chat:not(.fresh) .box .bar .sp,body.kb-open .box .bar .sp{display:none}
  .chat:not(.fresh) .send,body.kb-open .send{width:36px;height:36px}
  .chat:not(.fresh) .disc{margin-top:4px;font-size:11.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:nowrap}
  .chat:not(.fresh) .disc .kbd-tip{display:none}
}
/* 电脑版 ⇄ 手机版切换：悬浮条右侧、头像左边；手机宽度下隐藏（手机外框页有自己的切换） */
.lay{display:none}
@media (min-width:761px){
  .lay{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:#f3f5f7;flex:0 0 auto;order:1;margin-left:auto}
  .lay button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--ink3);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
  .lay button svg{width:15px;height:15px;flex:none}
  .lay button:hover{color:var(--ink)}
  .lay button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
  .lay button[aria-pressed="true"] svg{color:var(--brandD)}
  .lay button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
}
@media (min-width:761px) and (max-width:1279px){.lay button{padding:0 9px}.lay button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
@media (min-width:761px) and (max-width:1360px){:root{--gx:28px}}
@media (min-width:761px) and (max-width:1100px){:root{--gx:20px}
  .fn-a{padding:0 12px}.fn-a svg{display:none}.fn-logo{padding:6px 16px}
  #acctBtn .t,#acctBtn .car{display:none}.acct-btn{padding:0 6px}}
@media (min-width:761px) and (max-width:900px){.fn-a{padding:0 10px;font-size:14px}.fn-logo{padding:6px 10px}.fn-logo img{height:22px}.av-btn .car{display:none}}
@media (max-height:780px) and (min-width:761px){#dash{padding-top:22px}}

/* ---------- 手机版（方案二 · ≤760px）：安全区、触控尺寸、键盘、窄屏排版 ---------- */
@media (max-width:760px){
  :root{--top:calc(56px + env(safe-area-inset-top))}
  header.top{padding-top:env(safe-area-inset-top);padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  .tnav{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
  /* 横向滑动条：吸附时保留左侧留白，第一张卡不贴屏幕边 */
  .tx-coins,.sugg{scroll-padding-inline:16px}
  .tx-coins{scrollbar-width:none}.tx-coins::-webkit-scrollbar{display:none}
  /* 曲线点旁摘要：按钮放大到手指好点的尺寸 */
  .ptc{width:268px;max-width:calc(100% - 8px)}
  .ptc .pc-x{width:32px;height:32px;border-radius:9px;font-size:16px}
  .ptc .pc-a button,.ptc .pc-a a{height:34px}
  .ptc .pc-a .pg2{width:38px}
  /* 演示账户提示：同样的信息，占更少高度 */
  .demo-acct{padding:12px 14px;gap:8px}
  .demo-acct p{font-size:13px;line-height:1.5;margin:0}
  .demo-acct .btn{height:40px;font-size:14px}
  /* 钱包余额卡：三项改成逐行对齐，不再在窄列里折行 */
  .bal .kv{grid-template-columns:minmax(0,1fr);gap:0;padding:4px 14px}
  .bal .kv>div{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 0}
  .bal .kv>div+div{border-top:1px solid rgba(255,255,255,.07)}
  .bal .kv b{margin-top:0;text-align:right}
  /* AI：手机没有 Enter/Shift 键位说明的意义 */
  .disc .kbd-tip{display:none}
  /* 输入时（软键盘弹出）：收起底部导航，对话区贴合可见高度 */
  body.kb-open .tnav{display:none}
  body.kb-open .ai{height:calc(var(--vvh,100dvh) - var(--top))}
  /* 新会话：问候和输入框在屏幕中部（与电脑版“新会话输入框居中”一致），不再全部压在底部 */
  .chat.fresh .composer{justify-content:center;padding-bottom:24px}
  /* 键盘弹出时：Dodo 页只留标题、消息和输入框，推荐问题和说明暂时收起 */
  body.kb-open .hi-bot,body.kb-open .hello .sum,body.kb-open .chat.fresh .sugg,body.kb-open .disc{display:none!important}
  body.kb-open .hello{grid-template-columns:1fr;margin-bottom:10px}
  body.kb-open .chat.fresh .composer{justify-content:flex-end;padding-bottom:8px}
  /* 触控尺寸：分段按钮、文字链接至少 34–36px 高 */
  .seg button{height:34px}
  .lnk,.cvp .foot .allg,.posx .hd .lnk{min-height:36px;display:inline-flex;align-items:center}
  /* 总览「策略执行明细」：标题和今日计数分两行，不再挤成三行 */
  .ovx summary{flex-wrap:wrap;row-gap:2px;position:relative;padding-right:40px}
  .ovx summary .mut{flex-basis:100%}
  .ovx summary::after{position:absolute;right:14px;top:19px;margin:0}
  /* 交易记录：日期组头「当天账本 →」靠右，不再单独掉一行 */
  .dg-hd{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;row-gap:1px;align-items:center}
  .dg-hd b{grid-area:1/1}.dg-hd>.num{grid-area:2/1;min-width:0}.dg-hd .sp{display:none}.dg-hd>.lnk{grid-area:1/2/3/3}
  /* 交易详情头：日期和方向分行，方向标签不折行 */
  .td-hero{flex-direction:column;align-items:flex-start;gap:10px}
  .td-hero h3{flex-wrap:wrap}
  /* K 线：头部换行后高度不固定，图本身给固定高度，不再被压成 0 */
  .kp,.xk .kp{height:auto}
  .kwrap{flex:none;height:240px}
}
/* ===================== v15: phone-first design (≤760px) =====================
   Desktop never shows these hooks; on a phone each page leads with its answer, then details on demand. */
.mf-tg,.ov-sh,.bf-more,.tx-ft{display:none}
.tx-more{display:contents}
@media (max-width:760px){
  /* shared rhythm: 16px gutters, 24px between sections, 17px section titles, 44px targets */
  #dash{padding:12px 16px 32px}
  .ph{flex-wrap:nowrap;align-items:center;gap:10px;margin-bottom:14px}
  .ph>div{min-width:0;flex:1}
  .ph h1{font-size:23px;letter-spacing:-.01em}
  .ph p{font-size:13px;line-height:1.45;margin-top:2px}
  .ph .vsub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ph>.demo{flex:none;font-size:11px;padding:3px 8px;max-width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .demo-acct{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px;padding:10px 12px;margin-bottom:14px;border-radius:12px}
  .demo-acct>.demo{display:none}
  .demo-acct p{grid-column:1/-1;font-size:13px;line-height:1.45}
  .demo-acct .sp{display:none}
  .demo-acct .btn{height:auto;min-height:38px;min-width:0;font-size:13px;padding:4px 10px;line-height:1.25;white-space:normal;text-align:center;justify-content:center}
  /* a fold row: title, one-line summary, chevron */
  .mf-tg{appearance:none;border:0;background:none;width:100%;display:flex;align-items:center;gap:10px;min-height:52px;padding:12px 2px;font:inherit;text-align:left;cursor:pointer;color:var(--ink)}
  .mf-tg>b{font-size:16px;font-weight:700;flex:none}
  .mf-tg>span{margin-left:auto;min-width:0;font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mf-tg>span b{color:var(--ink);font-weight:650}.mf-tg>span em{font-style:normal;color:#b45309;font-weight:600}
  .mf-tg>i{flex:none;width:8px;height:8px;margin:0 6px 4px 2px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(45deg);transition:transform .25s;color:var(--ink3)}
  .mf-tg[aria-expanded="true"]>i{transform:rotate(-135deg);margin-bottom:-4px}
  .mf-tg:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:10px}
  [data-mf]:not(.mopen)>:not(.mf-tg){display:none!important}

  /* ---------- 总览: answer first, then the curve, then the breakdown ---------- */
  .ov{gap:24px}
  #kpis,.ov-mid{display:contents}
  .ov>*,#kpis>*,.ov-mid>*{min-width:0}
  .hero{order:1}
  #curveSec{order:2}
  .ov-sh{order:3}.ldg{order:4}
  #posMini{order:5}
  #yld{order:6}
  .ovx{order:7}
  .ov-note{order:8}
  .ldg{margin-top:-14px}
  .ov-sh{display:flex;align-items:baseline;gap:10px;margin:0;font-size:17px;font-weight:700}
  .ov-sh small{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--ink3)}
  .hero{padding:20px 18px 16px;gap:4px}
  .hero .k{font-size:13px;flex-wrap:wrap;gap:6px 10px}
  .hero .v{font-size:38px;margin-top:8px}
  .hero .d{font-size:13.5px;margin-top:6px}
  .hero .chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:14px}
  .hero .chips span{display:flex;flex-direction:column;gap:2px;padding:8px 10px;font-size:12px}
  .hero .chips span{background:none;border-radius:0;padding:0 0 0 12px;border-left:1px solid rgba(255,255,255,.12)}
  .hero .chips span:first-child{border-left:0;padding-left:0}
  .hero .chips b{margin:0;font-size:14px}
  .hero .nsp{height:120px;top:30px}
  /* 账户状况 is no longer a card inside the card: a fold row on the dark surface */
  .brief{background:none;box-shadow:none;border-radius:0;padding:0;margin-top:10px;border-top:1px solid rgba(255,255,255,.1)}
  .brief>h3{display:none!important}
  .brief .mf-tg{color:#fff;min-height:50px;padding:10px 0}
  .brief .mf-tg>b{font-size:14.5px}
  .brief .mf-tg>span{color:#9aa3b0}.brief .mf-tg>span b{color:#fff}.brief .mf-tg>span b.up{color:#4ade80}.brief .mf-tg>span b.dn{color:#ff7a7e}.brief .mf-tg>span em{color:#ffb44d}
  .brief .mf-tg>i{color:#9aa3b0}
  .brief.mopen .r:first-of-type{border-top:1px solid rgba(255,255,255,.07)}
  .brief[data-mf]:not(.mopen)>.acts{display:flex!important}
  .brief .acts{padding-top:6px}
  .brief .acts button{height:44px;font-size:14.5px;border-radius:12px}
  .brief .acts .go2{padding:0 18px}
  .cvp{padding:16px 14px 8px}
  .cvp .hd2{gap:8px 12px}
  .cvp .hd2 h2{font-size:17px}
  .cv-flip{height:240px}
  .lg .lh{padding:14px 2px 14px 4px}
  .lg .v{font-size:24px}
  .lg .go3{height:40px;padding:0 14px}
  #rangeSeg button{height:38px}
  .rc-tabs button{height:36px}
  .ovx summary{min-height:52px;padding:12px 40px 12px 4px;font-size:14px;color:var(--ink2)}
  .ovx .in{padding:0 4px 14px}
  .ovx .in .acts{margin-left:0;width:100%}
  .ovx .in .acts button{flex:1;height:42px}
  .posx .hd h2{font-size:17px}
  .posx .sum .ratio{font-size:30px}
  .bf:not(.mall)>.bf-r:nth-child(n+6){display:none}
  .bf-more{display:flex;align-items:center;justify-content:center;width:100%;height:46px;margin-top:8px;border:0;border-radius:12px;background:#f1f4f6;font:inherit;font-size:14px;font-weight:650;color:var(--ink);cursor:pointer}
  .bf-more:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .yld{padding:16px 16px}
  .ov-note{font-size:12px;line-height:1.6}

  /* ---------- 交易记录: slim summary, coin chips, one filter row, scan-friendly list ---------- */
  .tx-hero{padding:18px 16px 16px;gap:14px}
  .tx-hero .geo{width:200px;height:200px;right:-80px;top:-100px}
  .tx-l .k{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tx-l .v{font-size:32px;margin-top:4px}
  .tx-l .d{font-size:13px;line-height:1.5}
  .tx-l .d2{font-size:12px;color:#7d8794;margin-top:4px}
  .tx-l .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .tx-l .acts .btn{height:42px;padding:0 10px;font-size:14px;width:100%}
  .tx-r .hh{font-size:12.5px}
  .tx-r .hh small{display:none}
  .bars{min-height:64px;height:64px}
  .tx-coins{margin:12px -16px 0!important;padding:4px 16px 10px}
  .tx-coins .ci{flex:0 0 auto;min-width:96px;padding:8px 12px;border-color:var(--line2)}
  .tx-coins .ci.all{flex-basis:auto;min-width:112px}
  .ci .sk,.ci .p{display:none}

const sgx = (n, d = 2) => n == null ? '—' : sgn(n, d), clx = n => n == null ? '' : cls(n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- mascot ---------- */

<rect x="18" y="14" width="66" height="63" rx="18" fill="#1fbfa2"/><rect x="15" y="11" width="64" height="62" rx="18" fill="url(#bg_ID)"/>
<rect x="22" y="15" width="46" height="6" rx="3" fill="rgba(255,255,255,.26)"/>
<g class="eye"><circle cx="47" cy="44.6" r="19.5" fill="rgba(0,0,0,.07)"/><circle cx="47" cy="43" r="19" fill="#f5f0e1"/>
<g class="pupil"><circle cx="52" cy="40" r="9.6" fill="#141416"/><rect x="47.4" y="38" width="2.8" height="5" fill="#ef4444"/><rect x="48.4" y="35.8" width=".8" height="9.4" fill="#ef4444"/>
<rect x="52.6" y="35" width="2.8" height="7" fill="#22c55e"/><rect x="53.6" y="32.8" width=".8" height="11.4" fill="#22c55e"/><circle cx="56.2" cy="34.8" r="2.3" fill="#fff"/></g></g>`;

/* ---------- deterministic simulation (demo data) ---------- */
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const DAYS = 91, SUB = 8, FEE = .0004;
const TZ = 'Asia/Singapore';

const sgParts = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(now);

function simAccount(cfg) {

    parts.forEach(p => { for (const c in p.days[i].coins) o.coins[c] = (o.coins[c] || 0) + p.days[i].coins[c]; });

    S.view = nv; S.tf.acct = ''; S.tDetail = null;
    if (rendered) { renderAll(); if (CUR) showPage(CUR); }
  };
  addEventListener('td:accounts', sync); addEventListener('td:session', sync);
}

/* ===================== what survives a refresh ===================== */
/* account, density, conversations and demo bills stay on this computer; filters, K-line period and the open ledger last for this tab */
const SS_KEY = '3dtrading.dash.state', VIEW_KEY = '3dtrading.dash.view', WIPED_KEY = '3dtrading.dash.wiped';
let NOSAVE = false;
function saveState() {
  if (NOSAVE) return;
  try {
    localStorage.setItem(VIEW_KEY, S.view);
    sessionStorage.setItem(SS_KEY, JSON.stringify({ range: S.range, ir: S.ir, rc: S.rc, hid: [...S.hid], open: [...S.open], tf: S.tf, flip: S.flip, tShow: S.tShow, kc: S.kc, kp: S.kp, kOpen: S.kOpen === 'top' ? 'top' : '' }));
  } catch (e) {}
}
function loadState() {
  try {
    const v = TDAccount.accounts().active; S.view = v === 'all' || acctById(v) ? v : 'all';
    const o = JSON.parse(sessionStorage.getItem(SS_KEY) || 'null'), R = [30, 60, DAYS], coin = c => COINS.some(x => x[0] === c);
    if (o) {
      if (R.includes(o.range)) S.range = o.range;
      if (R.includes(o.ir)) S.ir = o.ir;
      if (Array.isArray(o.hid)) S.hid = new Set(o.hid.filter(k => STB[k]));
      if (Array.isArray(o.open)) S.open = new Set(o.open.filter(coin));
      if (o.tf) S.tf = { coin: coin(o.tf.coin) ? o.tf.coin : '', act: ['L', 'S'].includes(o.tf.act) ? o.tf.act : '', acct: acctById(o.tf.acct) ? o.tf.acct : '', day: /^(today|d\d+)$/.test(o.tf.day || '') ? o.tf.day : '' };
      if (Number.isInteger(o.flip) && o.flip >= 0 && o.flip < DAYS) S.flip = o.flip;
      if (typeof o.rc === 'string' && /^[A-Z0-9]{2,8}$/.test(o.rc)) S.rc = o.rc;
      if (Number.isInteger(o.tShow) && o.tShow >= 20) S.tShow = o.tShow;
      if (coin(o.kc)) S.kc = o.kc;
      if (KP[o.kp]) S.kp = o.kp;
      if (o.kOpen === 'top') S.kOpen = 'top';
    }
  } catch (e) {}
}
addEventListener('pagehide', () => { saveState(); saveConvs(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });

history.scrollRestoration = 'manual';
window.addEventListener('hashchange', route);
window.addEventListener('popstate', route);
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!document.body.classList.contains('binding')) drawVisible(); }, 120); });
document.documentElement.classList.add('js');
paintBots();
loadState(); loadWal(); if (!noLive() && !pendingAcct()) computeView(); loadConvs();
mountAccount();
route();
try { if (sessionStorage.getItem(WIPED_KEY)) { sessionStorage.removeItem(WIPED_KEY); setTimeout(() => toast('已清除本机保存的会话、Token 记录和偏好'), 300); } } catch (e) {}


/* 历史话题：电脑和手机都是从右侧滑出的面板（话题列表不再常驻），Esc / 点遮罩 / ✕ 关闭 */
(() => {
  const tg = $('#cvTg'), pane = $('#cvPane');
  const set = window.cvPanel = o => {
    document.body.classList.toggle('cv-open', o); tg.setAttribute('aria-expanded', o); pane.inert = !o;
    if (o) { renderCvList(); ($('#cvList .cv-i.on button.o') || $('#cvNew')).focus({ preventScroll: true }); }
  };
  pane.inert = true;
  tg.addEventListener('click', () => set(!document.body.classList.contains('cv-open')));
  $('#cvX').addEventListener('click', () => { set(false); tg.focus(); });
  $('#cvSc').addEventListener('click', () => set(false));
  pane.addEventListener('click', e => { if (e.target.closest('.cv-i button.o, #cvNew')) set(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('cv-open')) { set(false); tg.focus(); } });
  window.addEventListener('hashchange', () => set(false));
})();
/* 软键盘：聚焦输入框 且 可见高度明显变矮 才算键盘打开。
   - 打开时：手机收起底部导航；横屏/宽屏（>760）收起顶部悬浮条；AI 对话区贴合可见高度，发送按钮不被挡。
   - 键盘收起但输入框仍聚焦（安卓返回键、蓝牙键盘）、切页、横竖切换时重新判断并恢复导航。
   - 每个宽度记下见过的最大高度作为"无键盘高度"，兼容 iOS（只缩可视区）和安卓（整页变矮）两种方式。 */
(() => {
  const vv = window.visualViewport, root = document.documentElement, body = document.body;
  const isField = el => el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|range)$/.test(el.type)));
  const full = {}, visH = () => vv ? vv.height * (vv.scale || 1) : innerHeight;
  const touch = () => window.__kbTouch ?? matchMedia('(pointer:coarse)').matches;
  let lastW = Math.round(innerWidth);
  const base = () => {
    const k = Math.round(innerWidth);
    /* 触屏设备键盘开着旋转：新方向还没见过无键盘高度，按旋转前的宽度估一个下限（约 0.8 倍），避免漏判 */
    if (full[k] == null && touch() && Math.abs(k - lastW) > 100 && (k > innerHeight) !== (lastW > (full[lastW] || 0))) full[k] = Math.round(lastW * .8);
    lastW = k;
    return full[k] = Math.max(full[k] || 0, innerHeight, visH());
  };
  let open = false;
  const update = () => {
    const f = base(), h = visH();
    const shrunk = vv ? f - h > Math.max(80, f * .15) : MOB.matches; /* 没有 visualViewport 的旧浏览器：手机宽度沿用只看聚焦 */
    const o = isField(document.activeElement) && shrunk;
    if (o) root.style.setProperty('--vvh', Math.round(h) + 'px'); else root.style.removeProperty('--vvh');
    if (o !== open) { open = o; body.classList.toggle('kb-open', o); }
    if (o && body.dataset.page === 'ai') window.scrollTo(0, 0);
  };
  window.__kb = { update, state: () => ({ open, full: base(), vis: Math.round(visH()) }) }; /* 供浏览器验证读取，不改行为 */
  base();
  document.addEventListener('focusin', update);
  document.addEventListener('focusout', () => setTimeout(update, 60));
  if (vv) vv.addEventListener('resize', update);
  addEventListener('resize', update);
  addEventListener('hashchange', () => setTimeout(update, 0));
  addEventListener('orientationchange', () => setTimeout(update, 300));
  MOB.addEventListener('change', e => {
    HINT = e.matches ? HINT_M : HINT_D;
    update();
    if (S.flip == null && $('#cvHint')) $('#cvHint').textContent = HINT;
  });
})();
})();
