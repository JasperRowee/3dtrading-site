<!doctype html>
<html lang="zh-CN" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<title>3dtrading · 绑定币安 · 图解教程</title>
<link rel="icon" type="image/svg+xml" href="../assets/dodo.svg">
<meta name="theme-color" content="#181a20">
<link rel="stylesheet" href="page.css?v=r49l">
<link rel="stylesheet" href="bind-bn.css?v=r58">
<link rel="stylesheet" href="connect-r45.css?v=r58">
<link rel="stylesheet" href="tut.css?v=r76">
</head>
<body class="tut">
<!-- r49b · the illustrated tutorial of the 自行生成 route (from r48 connect.html), shown INSIDE the binding page (../index.html #guide)
     in a frame; opened on its own it redirects there. Three big steps, 上一步 / 下一步 / dots / 跳过, autoplay OFF by default.
     Always a dark Binance-style screen; our own coded illustration, never the live Binance site.
     There is no form here: 回到上方 scrolls the page back up to the API Key field (postMessage, no navigation). -->
<header class="bnh" id="hb">
  <button type="button" class="tx-exit" id="tcExit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span data-i18n="cx.exit">退出绑定</span></button>
  <a class="logo" id="logo" href="../" data-i18n-attr="aria-label:cx.toBind"><img src="../assets/3dtrading-logo-white.svg" alt="3dtrading" width="91" height="22"></a>
  <nav class="pg" id="pg" data-i18n-attr="aria-label:cx.prog" aria-label="绑定进度">
    <ol id="big"></ol>
    <button type="button" class="lk" id="skip" data-i18n="cx.skip">跳过</button>
  </nav>
  <span class="st" id="st"></span>
  <a class="lk out" id="out" href="#" target="_blank" rel="noopener noreferrer" data-i18n="cx.open">在币安打开</a>
  <span class="hic" id="hic"></span>
  <div class="hum" id="hum" hidden></div>
</header>
<main class="stage" id="stage" data-i18n-attr="aria-label:cx.stageL" aria-label="币安操作演示（不是真实币安页面）">
  <div class="view" id="view"><div class="bn" id="bn"></div><div class="ba" id="ba"></div></div>
  <span class="tag" data-i18n="cx.tag">操作演示 · 不是真实币安页面</span>
  <!-- r58: no side panel. The API Key field below is moved INTO the Binance screen's own 「API Key」 row on the last step
       (empty, nothing pre-filled). The panel is only the bind result, shown over the screen. The key is never stored or sent. -->
  <div class="tk-hold" id="tkHold" hidden>
    <form class="tk" id="tkF" novalidate autocomplete="off">
      <div class="tk-in"><input id="tkKey" name="bn58-k" autocomplete="off" spellcheck="false" autocapitalize="off" maxlength="80" placeholder="点这里直接粘贴 API Key" data-i18n-attr="placeholder:cx.kPh;aria-label:cx.kL" aria-label="API Key" aria-describedby="tkErr tkDemo"><small id="tkN" aria-hidden="true">0 / 64</small></div>
      <p class="err" id="tkErr" role="alert"></p>
      <div class="res" id="tkRes" role="status" hidden></div>
      <p class="demoH" id="tkDemo" data-i18n-html="cx.demoH"><b>演示</b>没有真实币安时，输入 <code>1234</code> 可模拟绑定成功（演示账户，不连接币安）。</p>
    </form>
  </div>
  <!-- r72 (Jasper: 不要在币安界面里突然加账户名): the account name and 绑定 live in our own small card, outside the Binance screen.
       They still belong to the form above (form="tkF"). -->
  <div class="tk-card" id="tkCard" hidden>
    <b class="tk-ch"><img src="../assets/3dtrading-logo.svg" alt="3dtrading" width="74" height="18"><span class="tk-nl" data-i18n="cx.nL">账户名称（可选）</span></b>
    <div class="tk-row"><input form="tkF" id="tkNm" name="bn58-n" maxlength="24" autocomplete="off" spellcheck="false" placeholder="账户名称（可选）" data-i18n-attr="placeholder:cx.nL;aria-label:cx.nL" aria-label="账户名称（可选）" aria-describedby="tkErr"><button form="tkF" type="submit" class="tk-go" id="backKey" data-i18n="cx.bind">绑定</button></div>
  </div>
  <section class="panel okp" id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="tkOkT"><div class="tk-ok" id="tkOk"></div></section>
  <nav class="tc" id="tc" data-i18n-attr="aria-label:cx.tcL" aria-label="教程控制">
    <a class="tcb x" id="tcClose" href="../#key"><span aria-hidden="true">↑</span> <span data-i18n="cx.close">返回绑定页</span></a>
    <!-- r66 · 首步和末步：演示提示在上，「用示例 Key 体验」在下，一键完成演示绑定 -->
    <div class="tdemo" id="tdemo" hidden><p class="tdh" data-i18n-html="cx.tryH"><b>演示</b>没有真实 Key？输入 <code>1234</code> 可演示绑定</p><button type="button" class="tcb try" id="tcDemo" data-i18n="cx.try">用示例 Key 体验</button></div>
    <div class="tcm">
      <button type="button" class="tcb" id="tcPrev"><span aria-hidden="true">‹</span> <span data-i18n="cx.prev">上一步</span></button>
      <ol class="dots" id="dots"></ol>
      <span class="sc" id="sc" aria-live="polite"></span>
      <button type="button" class="tcb pri" id="tcNext"><span data-i18n="cx.next">下一步</span> <span aria-hidden="true">›</span></button>
    </div>
    <label class="ap"><input type="checkbox" id="auto" role="switch"><i aria-hidden="true"></i><span data-i18n="cx.auto">自动播放</span></label>
  </nav>
</main>
<div class="hint" id="hint" role="status" aria-live="polite" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script src="../shim.js?v=r58"></script>
<script src="../../dashboard/account/td-bind.js?v=r58"></script>
<script src="../../dashboard/account/td-auth.js?v=r58"></script>
<script src="../../dashboard/account/vendor/qrcode.js?v=r58"></script>
<script src="bind-bn.js?v=r72"></script>
<script src="bn-app.js?v=r72"></script>
<script src="tutorial.js?v=r77"></script>
</body>
</html>
