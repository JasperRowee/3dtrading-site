<script>/* r63 · 同页衔接：官网空闲时把登录页预载在自己里面（?embed=1），转场的最后一段由官网驱动这页的界面进场，
   最后一帧把场景交给这页，地址栏换成登录页地址。嵌在官网里时，所有链接都在整页打开（base target=_top） */
(function(){try{var q=new URLSearchParams(location.search);if(q.get('embed')==='1'&&window.parent!==window&&parent.__siteJoin){window.__EMBED=true;var d=document.documentElement;d.classList.add('embed','embed-wait','jui');d.style.setProperty('--jp','0');var b=document.createElement('base');b.target='_top';document.head.appendChild(b)}}catch(e){}})();</script>

            <div class="inp has-eye"><input id="pw" name="password" type="password" autocomplete="current-password" required aria-describedby="mPw">
              <button type="button" class="eye" data-eye="pw" aria-pressed="false" data-i18n-attr="aria-label:auth.show"><svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button></div>
            <div class="meter" data-only="register" id="meter" data-s="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

            <div class="msg" id="mPw2"></div></div>

          <div class="row2" data-only="login"><button type="button" class="link" id="forgot" aria-expanded="false" aria-controls="fp" data-i18n="auth.forgot">忘记密码？</button></div>
          <div class="note info" id="fp"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5v.01"/></svg><span data-i18n="auth.forgotNote">演示环境还不能找回密码。正式上线后会通过邮箱验证码重置。</span></div>

          <div class="fld agree" data-only="register" id="fAgree">
            <div class="agl"><label class="chk"><input type="checkbox" id="agree" aria-describedby="mAgree"><span data-i18n="auth.agree">我已阅读并同意《合作服务协议与风险披露》</span></label>
              <button type="button" class="link agx" id="agOpen" aria-expanded="false" aria-controls="agDoc" data-i18n="auth.agOpen">查看全文</button></div>

            <div class="msg" id="mAgree"></div>

<script>/* r61 · the cross-page fade (@view-transition) is only for the website <-> log-in pair; leaving for any other page (dashboard,
   bind, tutorial) it is skipped here, before the switch: those pages don't opt in, and Chrome would abort it there with an error.
   r62: matched on the path's end, so it also holds under the published prefix (/3dtrading-site/login/) */
addEventListener('pageswap', function (e) { var v = e.viewTransition; if (!v) return; var u = ''; [v.ready, v.finished, v.updateCallbackDone].forEach(function (q) { q && q.catch(function () {}); });   // r62: the browser may still give it up (it is only a fade); that is no error
  try { u = new URL(e.activation && e.activation.entry && e.activation.entry.url || '', location.href).pathname; } catch (x) {}
  if (!/\/(site|login)\/(index\.html)?$/.test(u)) v.skipTransition(); });</script>

<script>/* r62 · 返回官网 (logo): the form fades, the camera flies straight at the planet (the website's line, its motion law) until the
   shell covers the screen; the website carries on from there, in through the shell, to the step you left (r62.site.at, else 01).
   Arrival (?via=…) is dropped from the address so a reload is plain. */
(function(){var a=document.getElementById('home');try{var u=new URL(location.href);if(u.searchParams.has('via')){u.searchParams.delete('via');history.replaceState(history.state,'',u.pathname+u.search+u.hash)}}catch(e){}
if(!a)return;a.addEventListener('click',function(e){if(e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;var P=window.__planet;if(!P||!P.fly||P.still)return;e.preventDefault();
try{var G=window.DeviceOrientationEvent,k=sessionStorage.getItem('r49site.gy');if(G&&typeof G.requestPermission==='function'&&k!=='skip'&&k!=='denied')G.requestPermission().then(function(r){try{sessionStorage.setItem('r49site.gy',r==='granted'?'on':'denied')}catch(x){}if(r==='granted'&&window.__EMBED&&parent.__gyOn)parent.__gyOn()}).catch(function(){})}catch(x){}/* r68 · 3: this tap counts as the person's go-ahead for motion back on the website */

var n=1;try{n=Math.max(1,parseInt(sessionStorage.getItem('r62.site.at'))||1)}catch(x){}var to=a.getAttribute('href')+'?at='+n+'&via=planet',d=document.documentElement;
d.classList.remove('arrive');d.classList.add('leave');setTimeout(function(){P.fly(0,function(){if(window.__EMBED&&parent.__siteJoin)parent.__siteJoin.back();else location.href=to})},60)});
window.__joinBack=function(){a.click()};
(window.requestIdleCallback||setTimeout)(function(){var l=document.createElement('link');l.rel='prefetch';l.href=a.getAttribute('href');document.head.appendChild(l)},{timeout:3000})})()</script>
<script>/* r63 · 同页衔接的这一侧：prep(去哪个模式/语言) · ui(界面进场 0–1) · go(场景交接) */
(function(){if(!window.__EMBED)return;var d=document.documentElement;
window.__join={ready:true,
 prep:function(url){try{var q=new URL(url,location.href).searchParams,m=q.get('mode')==='login'?'login':q.get('mode')==='register'?'register':null,l=q.get('lang');
   if(m){var b=document.querySelector('#tabs [data-mode="'+m+'"]');if(b&&b.getAttribute('aria-selected')!=='true')b.click()}
   if(l==='en'||l==='zh'){var lb=document.querySelector('#lang [data-lang="'+l+'"]');if(lb)lb.click()}}catch(e){}},
 ui:function(p){d.style.setProperty('--jp',Math.max(0,Math.min(1,p)).toFixed(4))},
 go:function(){d.style.setProperty('--jp','1');d.classList.add('joined');d.classList.remove('embed-wait','jui','arrive');if(window.__planetJoin)window.__planetJoin();d.classList.remove('arrive');dispatchEvent(new Event('td:join'))}};})();</script>
