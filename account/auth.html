html[data-theme=day]{--bg:#f6fbfd;--ink2:#3c4a52;--ink3:#56646b}

body::after{background:radial-gradient(70% 60% at 85% 0%,rgba(47,220,188,.06),transparent 60%),linear-gradient(180deg,transparent 70%,rgba(0,0,0,.28))}
html[data-theme=day] body::after{background:radial-gradient(60% 55% at 0% 0%,rgba(178,226,250,.5),transparent 65%),radial-gradient(55% 50% at 100% 0%,rgba(180,242,230,.42),transparent 62%),radial-gradient(70% 60% at 50% 110%,rgba(200,236,248,.45),transparent 70%)}
/* left column */
.hero{padding:clamp(28px,9vh,104px) clamp(32px,6vw,104px) 24px}
.hero h1{font-size:clamp(40px,4.3vw,62px);line-height:1.06;letter-spacing:-.034em;margin:0 0 16px;font-weight:760}
.hero h1 em{background:linear-gradient(92deg,#d9c48c 0%,#8fe9d3 32%,#2fdcbc 78%);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-theme=day] .hero h1{color:#0f1c22}
html[data-theme=day] .hero h1 em{background:linear-gradient(92deg,#0a7f6b 0%,#0f9a82 55%,#16b395 100%);-webkit-background-clip:text;background-clip:text}
.hero p.lede{font-size:17px;line-height:1.6;margin:0 0 26px;max-width:26em;color:var(--ink2)}
html[data-theme=day] .hero p.lede{color:#3c4a52}
.pts{display:flex;flex-direction:column;flex-wrap:nowrap;gap:10px;max-width:620px;border:0!important;grid-template-columns:none}
html[data-theme] .pts li,html[data-theme] .pts li+li{display:flex;align-items:center;gap:9px;padding:0!important;margin:0!important;box-shadow:none!important;font-size:14px;line-height:1.4;color:var(--ink)}
.pts li b{margin:0!important;font-size:14px;font-weight:600;color:inherit}
.pts .k{width:26px;height:26px;border-radius:8px;flex:none}
.pts .k svg{width:15px;height:15px}
.pts li:nth-child(2) .k{background:rgba(47,220,188,.12);color:var(--brand)}
html[data-theme=day] .pts li{color:#1d2a30}
html[data-theme=day] .pts .k{background:rgba(10,138,115,.1)!important;color:var(--brandD)!important}
/* the form: no shell, no thick shadow — a soft veil behind it keeps it legible over the galaxy */
.side{position:relative}
.card,html[data-theme=day] .card{background:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:none!important;border-radius:0;padding:8px 4px 4px;max-width:400px}
.card::before{content:"";position:absolute;left:-60px;right:-60px;top:-50px;bottom:-50px;z-index:-1;height:auto;pointer-events:none;background:radial-gradient(closest-side,rgba(6,9,11,.72),rgba(6,9,11,.42) 60%,transparent)}
html[data-theme=day] .card::before{background:radial-gradient(closest-side,rgba(255,255,255,.82),rgba(255,255,255,.5) 60%,transparent)}
/* login / sign-up: two words with a sliding underline, not a filled pill */
.tabs,html[data-theme=day] .tabs{display:flex;gap:26px;height:auto;padding:0;margin:0 0 22px;border-radius:0;background:none;box-shadow:none}
.tabs button{height:36px;padding:0;font-size:17px;font-weight:650;border-radius:0;color:var(--ink3)}
.tabs button[aria-selected="true"],html[data-theme=day] .tabs button[aria-selected="true"]{color:var(--ink)}
.tabs .ink,html[data-theme=day] .tabs .ink{top:auto;bottom:-2px;left:0;height:2px;width:var(--iw,36px);border-radius:2px;background:var(--brand);box-shadow:none;transform:translateX(var(--ix,0px));transition:transform .35s var(--ease),width .35s var(--ease)}
html[data-theme=day] .tabs .ink{background:var(--brandD)}
.tabs[data-mode="register"] .ink{transform:translateX(var(--ix,0px))}
.card h2{font-size:22px;margin:0 0 4px}
.card .sub{font-size:14px;margin:0 0 18px;color:var(--ink2)}
.fld>span{color:var(--ink2)}
.card .inp input{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14)}
html[data-theme=day] .card .inp input{background:rgba(255,255,255,.92);border-color:rgba(15,40,50,.14)}
#go,#go:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 18px -12px rgba(47,220,188,.6)}
html[data-theme=day] #go,html[data-theme=day] #go:hover{box-shadow:0 8px 18px -12px rgba(10,138,115,.55)}
.row2{margin:-2px 0 16px}
/* the password-free demo entry, under the form */
.demo-go{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-top:16px;font-size:13.5px;color:var(--ink2)}
.demo-btn{appearance:none;border:0;background:none;padding:6px 2px;display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:650;color:var(--brand);cursor:pointer;border-radius:8px}
.demo-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
.demo-btn:hover svg{transform:translateX(3px)}
.demo-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.demo-btn[disabled]{opacity:.5;cursor:default}
.demo-go small{font-size:12.5px;color:var(--ink3)}
html[data-theme=day] .demo-btn{color:var(--brandD)}
.card.signed .demo-go{display:none}
.done .who{background:rgba(127,127,127,.08)}
@media (min-width:901px){.wrap{min-height:100svh;height:100svh;overflow:hidden}.side{padding-top:0;padding-bottom:20px;align-items:center}}
@media (min-width:901px) and (max-height:620px){.wrap{height:auto;overflow:visible}}
@media (max-width:900px){
  .hero{padding:16px 20px 0}
  .hero h1{font-size:28px;margin:0 0 6px;max-width:none}.hero h1 br{display:none}
  .hero p.lede{font-size:14.5px;margin:0}
  .card{padding:4px 2px 0}.card::before{left:-20px;right:-20px}.side{overflow-x:clip}
  .side{padding:14px 18px 28px}
  .tabs{margin-bottom:14px}
  .card h2{font-size:20px}.card .sub{margin-bottom:12px}
}
@media (max-width:900px) and (max-height:760px){.hero{display:block}.hero p.lede{display:none}.side{padding-top:6px}}
@media (prefers-reduced-motion:reduce){.tabs .ink,.demo-btn svg{transition:none}}

  }
