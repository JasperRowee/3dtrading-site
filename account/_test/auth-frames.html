<!doctype html><meta charset="utf-8"><title>auth 390 frames</title>
<style>body{margin:0;padding:16px;background:#555;display:flex;gap:16px;font:12px sans-serif;color:#fff}iframe{width:390px;height:844px;border:0;border-radius:24px;background:#000}figure{margin:0}</style>
<script>
// ?mode=login|register — two 390×844 frames, night and day. The theme is set on each frame after it loads
// (writing 3dt.theme to storage would flip both frames, since the pages follow storage changes).
addEventListener('DOMContentLoaded',function(){var m=(location.search.match(/mode=(\w+)/)||[])[1]||'login';
['night','day'].forEach(function(th){var f=document.createElement('figure');f.innerHTML='<iframe src="../auth.html?mode='+m+'&t='+th+Date.now()+'"></iframe><figcaption>'+th+' · 390×844</figcaption>';document.body.appendChild(f);
  var fr=f.querySelector('iframe');fr.onload=function(){var w=fr.contentWindow;w.document.documentElement.dataset.theme=th;w.dispatchEvent(new w.CustomEvent('td:theme',{detail:{theme:th}}));};});});
</script>
