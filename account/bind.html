<style>
/* same world as the sign-in page: dark ground, soft mint/gold glow, a glass card on the right */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(90% 60% at 88% 0%,rgba(47,220,188,.10),transparent 60%),radial-gradient(70% 55% at 0% 100%,rgba(232,184,74,.07),transparent 60%)}
.bar{background:rgba(7,9,10,.88)}
.bd{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,460px);gap:clamp(28px,4vw,64px);max-width:1360px;margin:0 auto;padding:clamp(24px,5vh,56px) clamp(20px,4vw,56px) 72px}

/* left: headline + one short looping excerpt of the Binance setup */
.intro{position:sticky;top:calc(var(--barH) + env(safe-area-inset-top) + clamp(24px,5vh,56px));align-self:start;min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin:0 0 14px}
.eyebrow::before{content:"";width:18px;height:2px;border-radius:2px;background:linear-gradient(90deg,#e8b84a,var(--brand))}
.intro h1{font-size:clamp(30px,3.1vw,46px);line-height:1.08;letter-spacing:-.025em;margin:0 0 14px;font-weight:780;max-width:14em}
.intro h1 em{font-style:normal;background:linear-gradient(92deg,#f5d27a 0%,#e8b84a 30%,var(--brand) 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-size:15.5px;line-height:1.65;color:var(--ink2);margin:0 0 26px;max-width:34em}
.clip{border-radius:22px;padding:8px;background:linear-gradient(180deg,rgba(22,27,30,.7),rgba(12,15,17,.75));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 30px 80px -36px rgba(47,220,188,.35)}
.stage{position:relative;height:clamp(300px,44vh,440px);overflow:hidden;border-radius:16px;background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.stage .bn{transition:transform .7s cubic-bezier(.45,0,.2,1)}
.cap{display:flex;align-items:center;gap:12px;padding:12px 8px 6px 10px}
.cap-tx{flex:1;min-width:0;transition:opacity .3s}
.cap-tx.fade{opacity:0}
.cap-tx strong{display:block;font-size:15px;font-weight:700;line-height:1.35}
.cap-tx span{display:block;font-size:13px;line-height:1.5;color:var(--ink2)}
.cap .tagx{flex:none;font-size:11px;font-weight:650;color:var(--ink3);letter-spacing:.04em}
.cb{appearance:none;border:0;flex:none;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.06);color:var(--ink2);cursor:pointer;display:grid;place-items:center}
.cb:hover{color:var(--ink);background:rgba(255,255,255,.1)}
.cb svg{width:15px;height:15px;fill:currentColor}
.srcl{margin:10px 2px 0;font-size:11.5px;line-height:1.5;color:var(--ink3)}

/* right: the card, as on the sign-in page */
.card{position:relative;min-width:0;padding:28px 28px 24px;border-radius:28px;background:linear-gradient(180deg,rgba(22,27,30,.8),rgba(12,15,17,.85));-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),inset 0 1px 0 rgba(255,255,255,.06),0 40px 90px -40px rgba(0,0,0,.8)}
.card::before{content:"";position:absolute;left:28px;right:28px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(47,220,188,.7),rgba(232,184,74,.6),transparent)}
.phd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.phd h2{font-size:22px;letter-spacing:-.015em;margin:0 0 6px;font-weight:740}
.phd p{margin:0;color:var(--ink3);font-size:13.5px;line-height:1.55}
.skip{flex:none;height:36px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:650;white-space:nowrap}
.welcome{display:none;margin:0 0 14px}
.welcome.on{display:flex}
.list{margin:0 0 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.list:empty{display:none}
.lh{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:650;color:var(--ink3);margin:0 0 2px}
.acc{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:12px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.acc:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.acc.sel{box-shadow:inset 0 0 0 1.5px var(--brand)}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--warn)}
.dot.verified{background:var(--ok)}.dot.failed{background:var(--bad)}.dot.demo{background:#6b7a8c}
.acc .tx{flex:1;min-width:0}
.acc .tx b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .tx small{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .cur{font-size:11px;font-weight:700;color:var(--brand)}.acc .cur.dm{color:#a9b4c2}
.icb{appearance:none;border:0;background:none;width:32px;height:32px;border-radius:9px;color:var(--ink3);cursor:pointer;display:grid;place-items:center;flex:none}
.icb:hover{background:var(--sf3);color:var(--ink)}
.icb.rm:hover{color:var(--bad)}
.icb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icb.sure{width:auto;padding:0 10px;background:rgba(255,99,105,.14);color:var(--bad);font-size:12px;font-weight:700}
.card .inp input{background:rgba(0,0,0,.32);height:44px}

/* several sub-accounts at once: one block per sub-account, each with its own errors */
.rows{display:grid;gap:12px;margin:0 0 10px}
.arow{padding:14px 14px 4px;border-radius:16px;background:rgba(0,0,0,.24);box-shadow:inset 0 0 0 1px var(--line)}
.arow.bad{box-shadow:inset 0 0 0 1.5px rgba(255,99,105,.55)}
.arow-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-2px 0 10px}
.arow-h b{font-size:12.5px;font-weight:700;color:var(--ink3);letter-spacing:.02em}
.arow-h .icb{width:30px;height:30px}
.arow .fld{margin-bottom:10px}
.rerr{display:none;margin:-2px 0 10px;font-size:12.5px;line-height:1.5;color:#ff9a9e}
.arow.bad .rerr{display:block}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addrow{appearance:none;width:100%;height:44px;border:1.5px dashed rgba(255,255,255,.16);border-radius:13px;background:none;color:var(--ink2);font-size:13.5px;font-weight:650;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 6px}
.addrow:hover{border-color:rgba(47,220,188,.55);color:var(--ink)}
.addrow svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.addrow[hidden]{display:none}
.sum{margin:0 0 12px}
.sec{font-size:11.5px;font-weight:700;color:var(--ink3);letter-spacing:.05em;text-transform:uppercase;margin:16px 0 9px}
.checks{display:grid;gap:9px;margin-bottom:14px}
.checks .chk{font-size:13px}
.checks.err .chk input:not(:checked){border-color:var(--bad)}
.ckmsg{display:none;margin:-6px 0 12px;font-size:12.5px;color:var(--bad)}
.checks.err+.ckmsg{display:block}
.mini-ips{display:inline-flex;gap:5px;flex-wrap:wrap;margin:4px 0 0}
.mini-ips button{appearance:none;border:0;font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--sf3);color:var(--ink);cursor:pointer}
.mini-ips button:hover{background:#262d31}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:650;background:rgba(240,177,0,.14);color:#f5c84b;white-space:nowrap}
#go{height:50px;font-size:15.5px;box-shadow:0 12px 30px -10px rgba(47,220,188,.65)}
.safe{margin:12px 0 0;font-size:12px;padding:10px 12px}

/* result */
#resView{display:none}
.card.res #formView,.card.boot #formView{display:none}
.card.res #resView{display:block}
.card.res .lh{display:none}
.bootErr{padding:20px 0;font-size:14px;line-height:1.6;color:var(--ink2)}
.rhd{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.rhd .ic{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(240,177,0,.14);color:#f5c84b}
.rhd .ic.verified{background:rgba(34,197,94,.14);color:var(--ok)}
.rhd .ic.failed{background:rgba(255,99,105,.14);color:var(--bad)}
.rhd .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rhd h3{margin:2px 0 4px;font-size:18px}
.rhd p{margin:0;color:var(--ink2);font-size:13px;line-height:1.55}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.28);font-size:13px;margin-bottom:12px}
.kv dt{color:var(--ink3)}.kv dd{margin:0;text-align:right;word-break:break-all}
.bl{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.bl li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.28);font-size:13px}
.bl li b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl li small{color:var(--ink3);font-family:var(--mono);font-size:12px}
.bl li em{font-style:normal;font-size:11.5px;font-weight:650;color:#f5c84b;white-space:nowrap}
.flow{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:7px;font-size:13px}
.flow li{display:flex;gap:10px;align-items:flex-start;line-height:1.5;color:var(--ink2)}
.flow li i{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;margin-top:1px;background:var(--sf3);color:var(--ink3);font-style:normal;font-size:11px;font-weight:800}
.flow li.y i{background:var(--brand);color:var(--onb)}
.flow li.n i{background:rgba(255,99,105,.16);color:var(--bad)}
.flow li.w i{background:rgba(240,177,0,.16);color:#f5c84b}
.flow li b{color:var(--ink);font-weight:600}
.sim{margin:14px 0 0;padding:14px;border-radius:14px;border:1.5px dashed rgba(240,177,0,.45);background:rgba(240,177,0,.04)}
.sim h4{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:13px;color:#f5c84b}
.sim p{margin:0 0 10px;font-size:12px;line-height:1.55;color:var(--ink3)}
.sim .b3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sim .btn{justify-content:flex-start;height:38px;font-size:12.5px;padding:0 10px}
.ract{display:grid;gap:10px;margin-top:14px}
.fixl{margin:12px 0;padding-left:18px;display:grid;gap:6px;font-size:13px;line-height:1.55;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);font-weight:650;font-size:13.5px;padding:10px 16px;border-radius:11px;transition:.25s var(--ease);z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}

@media (max-width:1180px) and (min-width:901px){.bd{grid-template-columns:minmax(0,1fr) 400px}}
/* phone / tablet: one column, same excerpt on top, normal page scroll so the keyboard never hides a field */
@media (max-width:900px){
  :root{--barH:56px}
  .bar{padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
  .bar .logo img{height:19px}
  .demo-pill{display:none}
  .bd{display:block;padding:20px max(14px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
  .intro{position:static;padding:0 6px}
  .eyebrow{font-size:11.5px;margin-bottom:8px}
  .intro h1{font-size:27px;margin-bottom:8px}
  .lede{font-size:14.5px;margin-bottom:16px;color:#c8d1ce}
  .clip{margin:0 -6px;border-radius:20px;padding:6px}
  .stage{height:clamp(210px,62vw,330px);border-radius:14px}
  .cap{padding:10px 6px 4px 8px}
  .cap-tx strong{font-size:14.5px}.cap-tx span{font-size:12.5px}
  .card{margin-top:18px;padding:22px 16px 18px;border-radius:24px}
  .phd h2{font-size:20px}
  .inp input{font-size:16px}
  .arow{padding:12px 12px 2px}
}
@media (max-width:400px){.r2{grid-template-columns:1fr;gap:0}.skip{padding:0 10px}.cap .tagx{display:none}}
@media (orientation:landscape) and (max-height:500px) and (max-width:900px){.stage{height:min(70vh,300px)}}
@media (prefers-reduced-motion:reduce){.cap-tx{transition:none}}
.stage{height:auto;min-height:340px}

<body>
<header class="bar">
  <a class="logo" href="#" data-href="site" data-i18n-attr="aria-label:acct.toSite"><img class="lg-n" src="assets/3dtrading-logo-white.svg" alt="3dtrading" width="91" height="22"><img class="lg-d" src="assets/3dtrading-logo.svg" alt="3dtrading" width="91" height="22"></a>
  <span class="sp"></span>
  <span class="demo-pill" data-i18n="bind.pill">演示 · 未连接币安</span>
  <div id="lang"></div>
  <button type="button" class="av-btn ini" id="av"></button>
</header>

<main class="bd">
  <section class="intro" aria-labelledby="hh">
    <p class="eyebrow" data-i18n="bind.eyebrow">第 2 步 · 连接子账户</p>
    <h1 id="hh" data-i18n-html="bind.h1">把币安子账户<br><em>交给策略运行</em></h1>
    <p class="lede" data-i18n="bind.lede">每个子账户一组独立 API。可以一次连接多个，也可以先跳过。</p>
    <div class="clip" id="car" data-i18n-attr="aria-label:bind.carL" role="region">
      <div class="stage" id="stage" aria-hidden="true"><div class="bn" id="bn"></div></div>
      <div class="cap">
        <div class="cap-tx" id="capTx" aria-live="off"><strong id="ct"></strong><span id="cx"></span></div>
        <span class="tagx" data-i18n="bind.excerpt">节选 · 自动播放</span>
        <button type="button" class="cb" id="cPlay"></button>
      </div>
    </div>
    <p class="srcl" id="srcl"></p>
  </section>

  <section class="card boot" id="panel" aria-labelledby="formH">
    <div class="note good welcome" id="welcome" role="status"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></svg><span data-i18n="bind.welcome">演示账号已创建。</span></div>
    <div class="phd">
      <div><h2 id="formH"></h2><p id="formS"></p></div>
      <a class="btn ghost skip" id="skipBtn" href="#"></a>
    </div>
    <div class="list" id="list"></div>

    <div id="formView">
      <form id="f" novalidate autocomplete="off">
        <div class="note bad sum" id="sum" role="alert" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg><span id="sumT"></span></div>
        <div class="rows" id="rows"></div>
        <button type="button" class="addrow" id="addRow"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="bind.addRow">再添加一个子账户</span></button>

        <div class="sec" data-i18n="bind.checkH">已在币安完成</div>
        <div class="checks" id="checks" data-scroll-pad>
          <label class="chk"><input type="checkbox" data-ck><span data-i18n-html="bind.ck1">子账户已允许合约，并已开通统一账户</span></label>
          <label class="chk"><input type="checkbox" data-ck><span><span data-i18n-html="bind.ck2">只访问受信任的 IP，两个 IP 已保存</span><br><span class="mini-ips" id="miniIps"></span></span></label>
          <label class="chk"><input type="checkbox" data-ck><span data-i18n-html="bind.ck3">已核对最小权限边界</span></label>
        </div>
        <div class="ckmsg" data-i18n="bind.e.checks">请在币安里完成这三项，再勾选确认。</div>

        <button class="btn pri block" type="submit" id="go"></button>
        <button class="btn ghost block" type="button" id="cancel" style="margin-top:8px" data-i18n="bind.cancel" hidden>取消</button>
        <div class="note safe"><svg viewBox="0 0 24 24"><path d="M12 3.5 5 6.5v5c0 4.3 3 7.8 7 9 4-1.2 7-4.7 7-9v-5z"/></svg><span data-i18n="bind.safe">演示：只在本页检查格式，不连接币安。</span></div>
      </form>
    </div>

    <div id="resView" aria-live="polite"></div>
  </section>
</main>

<div class="toast" id="toast" role="status"></div>

  function toast(m) { var el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { el.classList.remove('on'); }, 2400); }
  // phones: a focused field is kept clear of the fixed bar and the keyboard
  document.addEventListener('focusin', function (e) {
    if (!mobile.matches || !e.target.matches || !e.target.matches('#f input')) return;
    var el = e.target.closest('.fld,.chk') || e.target;
    setTimeout(function () {
      var vv = window.visualViewport, r = el.getBoundingClientRect(), top = parseFloat(getComputedStyle(document.querySelector('.bar')).height) || 60;
      var bottom = vv ? vv.height + vv.offsetTop : innerHeight;
      if (r.top < top + 8 || r.bottom > bottom - 12) el.scrollIntoView({ block: 'center' });
    }, 300);
  });
  window.addEventListener('scroll', function () { document.body.classList.toggle('scrolled', scrollY > 4); }, { passive: true });

  window.addEventListener(A.events.lang, renderAll);
  window.addEventListener(A.events.accounts, function () { if (!A.session()) return; if (S.resId && !find(S.resId)) { S.resId = null; if (S.view === 'res' && !S.batch) S.view = 'form'; } render(); });
  window.addEventListener(A.events.session, function () { if (!A.session()) A.requireUser(location.pathname + location.search); });

  /* ---------- boot ---------- */
  try {
    if (RM.matches) document.documentElement.classList.add('bn-nomo');
    $('[data-href="site"]').href = A.routes.site;
    A.mountLangToggle($('#lang'), { theme: function () { return document.documentElement.dataset.theme === 'day' ? 'light' : 'dark'; } });
    A.mountMenu($('#av'), { context: 'account', theme: function () { return document.documentElement.dataset.theme === 'day' ? 'light' : 'dark'; }, logoutTo: A.routes.site });
    if (qs.get('first') === '1') $('#welcome').classList.add('on');
    var acc = A.accounts(), reId = qs.get('id'), ea = reId && find(reId);
    if (ea && A.isDemo(reId)) { A.setActive(reId); S.view = 'res'; S.resId = reId; resetForm(); }
    else if (ea) { S.editId = reId; resetForm({ name: ea.name, uid: ea.uid, label: ea.label }); }
    else if (qs.get('add') === '1' || !acc.list.length) { resetForm(); }
    else { resetForm(); S.view = 'res'; S.resId = acc.active !== 'all' && find(acc.active) ? acc.active : acc.list[acc.list.length - 1].id; }
    // drop one-shot flags from the address bar so a refresh doesn't replay them
    if (qs.has('first') || qs.has('add') || qs.has('id')) { ['first', 'add', 'id'].forEach(function (k) { qs.delete(k); }); history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : '') + location.hash); }
    renderAll();
    $('#panel').classList.remove('boot');
  } catch (err) {
    // Never fall back to the API form: keep it hidden and ask for a reload.
    try { console.error(err); } catch (_) {}
    var bp = $('#panel'); bp.classList.add('boot'); bp.classList.remove('res');
    var bv = $('#resView'); bv.style.display = 'block';
    bv.innerHTML = '<p class="bootErr">' + esc(A.t('bind.bootErr')) + '</p>';
  }
})();
</script>
