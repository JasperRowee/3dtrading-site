<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<title>3dtrading · 添加币安账户</title>
<script>/* r46: the binding page is one Binance-style screen with no day / night: always the dark palette. Its own theme key is never written, so another tab's day/night switch cannot reach it. */
document.documentElement.dataset.theme='night';document.documentElement.setAttribute('data-theme-key','3dt.theme.bnbind')</script>
<link rel="stylesheet" href="page.css?v=r41">
<link rel="stylesheet" href="bind-bn.css?v=r45">
<link rel="icon" type="image/svg+xml" href="../icons/dodo.svg?v=20261112">
<link rel="apple-touch-icon" sizes="180x180" href="../icons/dodo-180.png?v=20261112">
<link rel="manifest" href="../manifest.webmanifest?v=20261112">
<meta name="application-name" content="3dtrading">
<meta name="apple-mobile-web-app-title" content="3dtrading">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#181a20">
<link rel="stylesheet" href="r41.css?v=r41">
<link rel="stylesheet" href="connect-r45.css?v=r46">
</head>
<body>
<!-- r45/r46 · 添加币安账户: three big steps (开通子账户 → 创建API → 绑定API). A demo cursor walks to the control to press and moves
     on by itself, looping inside the current big step only; pressing that control yourself moves on at once. The Binance screens
     are our own coded illustration (desktop = Binance website, phone = Binance App + the official web route), never the live site.
     Only System-generated (HMAC) keys; nothing is created, stored or sent to Binance here, and the account stays 「未连接」. -->
<!-- r46: ONE top bar in Binance's own style. The 3dtrading logo (back to the dashboard) and the three big steps take the
     place of Binance's nav items; on the right only Binance's icons from 「我的」 (the user icon) onwards. The globe is our real
     language switch; the other icons are part of the illustration. No day / night switch here. -->
<header class="bnh" id="hb">
  <a class="logo" id="logo" href="#" data-i18n-attr="aria-label:cx.toApp"><img src="assets/3dtrading-logo-white.svg" alt="3dtrading" width="91" height="22"></a>
  <nav class="pg" id="pg" data-i18n-attr="aria-label:cx.prog" aria-label="绑定进度">
    <ol id="big"></ol>
    <button type="button" class="lk" id="skip" data-i18n="cx.skip">跳过</button>
  </nav>
  <span class="st" id="st"></span>
  <a class="lk out" id="out" href="#" target="_blank" rel="noopener noreferrer" data-i18n="cx.open">在币安打开</a>
  <span class="hic" id="hic"></span>
  <div class="hum" id="hum" hidden></div>
</header>
<main class="stage" id="stage" data-i18n-attr="aria-label:cx.stageL" aria-label="币安操作演示（不是真实币安页面）">
  <div class="view" id="view"><div class="bn" id="bn"></div><div class="ba" id="ba"></div></div>
  <span class="tag" data-i18n="cx.tag">操作演示 · 不是真实币安页面</span>
  <section class="panel bnp" id="panel" hidden aria-labelledby="pT">
    <h2 id="pT" data-i18n="cx.pT">把密钥填到 3dtrading</h2>
    <p class="sub" data-i18n="cx.pSub">在币安点「复制」后粘贴到这里。只检查格式，不发送、不保存。</p>
    <div class="res" id="res" hidden role="status" aria-live="polite"></div>
    <form id="f" novalidate autocomplete="off">
      <label class="fld" id="fKey" data-step="1"><span data-i18n="cx.key">API Key</span>
        <div class="inp"><input id="key" class="mono" name="cx-k" maxlength="80" spellcheck="false" autocapitalize="off" autocomplete="off" data-i18n-attr="placeholder:cx.keyPh" placeholder="粘贴 64 位 API Key"></div>
        <div class="kfoot"><span></span><span class="n" id="nKey">0 / 64</span></div><div class="msg" id="mKey"></div></label>
      <label class="fld" id="fSec" data-step="3"><span data-i18n="cx.sec">Secret Key</span>
        <div class="inp has-eye"><input id="sec" class="mono" type="password" name="cx-s" maxlength="80" spellcheck="false" autocapitalize="off" autocomplete="new-password" data-i18n-attr="placeholder:cx.secPh" placeholder="粘贴 64 位 Secret Key">
          <button type="button" class="eye" id="eye" data-i18n-attr="aria-label:cx.show" aria-pressed="false"></button></div>
        <div class="kfoot"><span></span><span class="n" id="nSec">0 / 64</span></div><div class="msg" id="mSec"></div></label>
      <label class="fld" id="fName" data-step="4"><span data-i18n="cx.name">账户名称</span>
        <div class="inp"><input id="name" name="cx-name" maxlength="40" data-i18n-attr="placeholder:cx.namePh" placeholder="例如 3dtUSDT01" autocomplete="off"></div><div class="msg" id="mName"></div></label>
      <button class="btn pri block" type="submit" id="go" data-step="5" data-i18n="cx.go">连接并验证</button>
      <p class="safe" data-i18n="cx.safe">演示版：验证服务还没接入，只检查格式；账户会一直显示「未连接」。</p>
    </form>
  </section>
</main>
<div class="cur" id="cur" aria-hidden="true"><svg viewBox="0 0 26 26"><path d="M3 2l17 10.5-7.4 1.6 4.4 8.2-3.3 1.7-4.4-8.2L3.9 21z"/></svg><i></i><em data-i18n="cx.demo">演示</em></div>
<div class="hint" id="hint" role="status" aria-live="polite" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script src="td-account.js?v=r45b"></script>
<script src="api-adapter.js?v=r43"></script>
<script src="bind-steps.js?v=r44"></script>
<script src="bind-bn.js?v=r46"></script>
<script src="bn-app.js?v=r46"></script>
<script src="connect-r45.js?v=r46"></script>
</body>
</html>
